name: CI workflow structure guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate primary workflow before integration evidence
        run: |
          set -euo pipefail
          python3 scripts/validate_ci_workflow.py \
            --workflow .github/workflows/ci.yml \
            --fixture-root tests/fixtures/ci_workflow_structure \
            --self-test
          python3 scripts/verify_canonical_roadmap.py docs/ROADMAP.md --self-test
