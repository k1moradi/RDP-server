name: C++23 protocol CI and prerelease delivery

on:
  push:
    branches: [main]
    tags: ['protocol-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_test_preview:
        description: Build startup-disabled SERVER-TEST preview bundles from main
        required: false
        default: false
        type: boolean
      r9_credssp_owner_candidate:
        description: Run the exact-SHA CredSSP owner-candidate prerequisite gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ci-workflow-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CI workflow structure and denial fixtures
        run: |
          set -euo pipefail
          python3 scripts/validate_ci_workflow.py \
            --workflow .github/workflows/ci.yml \
            --fixture-root tests/fixtures/ci_workflow_structure \
            --self-test
          python3 tests/test_r9_clean_windows_gate.py

  r2-linux-production-runtime-security:
    needs: ci-workflow-structure
    strategy:
      fail-fast: false
      matrix:
        dependency_mode: [complete, missing-systemd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install common production Linux admission dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libkrb5-dev libpam0g-dev pkg-config
      - name: Install production logind dependency
        if: matrix.dependency_mode == 'complete'
        run: sudo apt-get install -y --no-install-recommends libsystemd-dev
      - name: Require libsystemd when production runtime security is selected
        if: matrix.dependency_mode == 'missing-systemd'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/empty-pkgconfig
          set +e
          configure_output="$(
            PKG_CONFIG_LIBDIR="$PWD/build/empty-pkgconfig" PKG_CONFIG_PATH= \
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=OFF \
              -DRDP_SERVER_BUILD_TESTING=OFF \
              -DRDP_SERVER_TEST_LINUX_GSSAPI=OFF \
              -DRDP_SERVER_TEST_LINUX_PAM=OFF \
              -DRDP_SERVER_TEST_REAL_KERBEROS=OFF \
              -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF \
              -DRDP_SERVER_ENABLE_LINUX_RUNTIME_SECURITY=ON 2>&1
          )"
          configure_status=$?
          set -e
          printf '%s\n' "$configure_output"
          if [[ "$configure_status" -eq 0 ]]; then
            echo "production Linux security unexpectedly configured without libsystemd metadata" >&2
            exit 1
          fi
          grep -F "libsystemd" <<< "$configure_output"
      - name: Build production Linux security with tests disabled
        if: matrix.dependency_mode == 'complete'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DRDP_SERVER_BUILD_TESTING=OFF \
            -DRDP_SERVER_TEST_LINUX_GSSAPI=OFF \
            -DRDP_SERVER_TEST_LINUX_PAM=OFF \
            -DRDP_SERVER_TEST_REAL_KERBEROS=OFF \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF \
            -DRDP_SERVER_ENABLE_LINUX_RUNTIME_SECURITY=ON
          grep -Fx 'BUILD_TESTING:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_BUILD_TESTING:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_TEST_LINUX_GSSAPI:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_TEST_LINUX_PAM:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_ENABLE_LINUX_RUNTIME_SECURITY:BOOL=ON' build/CMakeCache.txt
          cmake --build build --config Debug --target rdp-server --parallel 2

          help_output="$(./build/rdp-server --help)"
          grep -F -- '--check-linux-security' <<< "$help_output"

          readelf -d build/rdp-server | tee build/r2-rdp-server-dynamic.txt
          grep -E 'Shared library: \[libgssapi_krb5\.so' build/r2-rdp-server-dynamic.txt
          grep -E 'Shared library: \[libpam\.so' build/r2-rdp-server-dynamic.txt
          grep -E 'Shared library: \[libsystemd\.so' build/r2-rdp-server-dynamic.txt

          ldd build/rdp-server | tee build/r2-rdp-server-ldd.txt
          if grep -Fq 'not found' build/r2-rdp-server-ldd.txt; then
            echo "production rdp-server has an unresolved runtime dependency" >&2
            exit 1
          fi
          grep -E 'libgssapi_krb5\.so' build/r2-rdp-server-ldd.txt
          grep -E 'libpam\.so' build/r2-rdp-server-ldd.txt
          grep -E 'libsystemd\.so' build/r2-rdp-server-ldd.txt

  protocol:
    needs: ci-workflow-structure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # R7 packaging assurance is pure Python/std-lib and must remain visible
      # even when an unrelated C++ target prevents the later full CTest.
      - name: Preflight R7 macOS bundle offline contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_macos_test_bundle.py \
            --script scripts/macos_test_bundle.py
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Record hosted macOS toolchain evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun clang++ --version
          xcrun --sdk macosx --show-sdk-version
      - name: Locate or install Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('C:\Program Files\OpenSSL-Win64',
                    'C:\Program Files\OpenSSL',
                    'C:\Program Files (x86)\OpenSSL-Win32')
          $found = $dirs | Where-Object { Test-Path (Join-Path $_ 'include/openssl/ssl.h') } | Select-Object -First 1
          if (-not $found) {
            choco install openssl --no-progress -y
            $found = $dirs | Where-Object { Test-Path (Join-Path $_ 'include/openssl/ssl.h') } | Select-Object -First 1
          }
          if (-not $found) { throw 'OpenSSL headers are unavailable on the Windows runner' }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$found"
      - name: Install Linux GSSAPI development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkrb5-dev libpam0g-dev libxcb1-dev libxcb-randr0-dev \
            pkg-config libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-damage0-dev libxcb-xtest0-dev \
            libxcb-xinput-dev xvfb xauth
      - name: Configure Debug protocol and tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
          linux_gssapi_tests=OFF
          linux_pam_tests=OFF
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            linux_gssapi_tests=ON
            linux_pam_tests=ON
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF \
            -DRDP_SERVER_TEST_LINUX_GSSAPI="$linux_gssapi_tests" \
            -DRDP_SERVER_TEST_LINUX_PAM="$linux_pam_tests"
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=OFF' build/CMakeCache.txt
      # R6 native-adapter validation must remain observable even when an
      # unrelated test target later fails the full repository compile.
      # This builds only the existing production-backed Windows fixture, then
      # the ordinary full build below still runs and remains authoritative.
      - name: Preflight Windows R6 native adapter tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Debug --target test_windows_desktop_geometry --parallel 2
          ctest --test-dir build --build-config Debug --timeout 20 -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
          cmake --build build --config Release --target test_windows_desktop_geometry --parallel 2
          ctest --test-dir build --build-config Release --timeout 20 -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
      - name: Compile Debug
        run: cmake --build build --config Debug --parallel 2
      - name: Qualify production certificate policy and generated identity
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            native_policy='security.windows-generated-tls-certificate-policy-profiles'
          else
            native_policy='security.macos-generated-tls-certificate-policy-profiles'
          fi

          generated_identity_selector='^runtime[.](generated-tls-identity-owner-ipv4-san-der|generated-tls-context-negotiates-tls13|rejects-tls-credentials-client-only-certificate|rejects-tls-credentials-expired-certificate|rejects-tls-credentials-not-yet-valid-certificate)$'
          generated_inventory="$(ctest --test-dir build --build-config Debug -N -R "$generated_identity_selector")"
          printf '%s\n' "$generated_inventory"
          for required_test in \
            runtime.generated-tls-identity-owner-ipv4-san-der \
            runtime.generated-tls-context-negotiates-tls13 \
            runtime.rejects-tls-credentials-client-only-certificate \
            runtime.rejects-tls-credentials-expired-certificate \
            runtime.rejects-tls-credentials-not-yet-valid-certificate; do
            grep -Fq ": $required_test" <<< "$generated_inventory"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$generated_inventory")" -eq 5

          native_selector="^${native_policy//./[.]}$"
          native_inventory="$(ctest --test-dir build --build-config Debug -N -R "$native_selector")"
          printf '%s\n' "$native_inventory"
          grep -Fq ": $native_policy" <<< "$native_inventory"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$native_inventory")" -eq 1

          ctest --test-dir build --build-config Debug --timeout 30 \
            -R "$generated_identity_selector" --verbose
          ctest --test-dir build --build-config Debug --timeout 30 \
            -R "$native_selector" --verbose
      - name: Qualify Microsoft Windows CredSSP harness round progression
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          selector='^security[.]windows-credssp-harness-(stream-buffer-retention|multi-turn-round-progression)$'
          inventory="$(ctest --test-dir build --build-config Debug -N -R "$selector")"
          printf '%s\n' "$inventory"
          grep -Fq ': security.windows-credssp-harness-stream-buffer-retention' <<< "$inventory"
          grep -Fq ': security.windows-credssp-harness-multi-turn-round-progression' <<< "$inventory"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$inventory")" -eq 2
          ctest --test-dir build --build-config Debug --timeout 30 -R "$selector" --verbose

      - name: Microsoft Windows CredSSP TLS-version matrix
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          selector='^security[.]windows-credssp-(tls-system-default|tls12-only-server|tls13-only-server)$'
          inventory="$(ctest --test-dir build --build-config Debug -N -R "$selector")"
          printf '%s\n' "$inventory"
          for required_test in \
            security.windows-credssp-tls-system-default \
            security.windows-credssp-tls12-only-server \
            security.windows-credssp-tls13-only-server; do
            grep -Fq ": $required_test" <<< "$inventory"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$inventory")" -eq 3

          result_file='build/r9-credssp-tls-version-results.txt'
          : > "$result_file"
          run_tls_profile() {
            local result_key="$1"
            local test_name="$2"
            local profile="$3"
            local output_file="build/${result_key}.txt"
            local escaped_test_name="${test_name//./[.]}"
            if ! ctest --test-dir build --build-config Debug --timeout 45 \
                -R "^${escaped_test_name}$" --verbose 2>&1 | tee "$output_file"; then
              printf '%s=FAIL test=%s\n' "$result_key" "$test_name" | tee -a "$result_file"
              return 1
            fi
            local receipt
            receipt="$(grep -Eo 'microsoft-credssp-tls-version-matrix .*' "$output_file" | tail -n 1)"
            test -n "$receipt"
            grep -Fq "profile=${profile}" <<< "$receipt"
            local receipt_status
            receipt_status="$(sed -n 's/.* status=\([^ ]*\).*/\1/p' <<< "$receipt")"
            test "$receipt_status" = PASS || test "$receipt_status" = ORACLE_LIMITATION
            printf '%s=%s test=%s\n' "$result_key" "$receipt_status" "$test_name" | tee -a "$result_file"
            printf '%s\n' "$receipt" | tee -a "$result_file"
          }

          overall_status=0
          if ctest --test-dir build --build-config Debug --timeout 30 \
              -R '^runtime[.]generated-tls-context-negotiates-tls13$' --verbose; then
            printf '%s\n' \
              'server-production-tls13=PASS test=runtime.generated-tls-context-negotiates-tls13' \
              | tee -a "$result_file"
          else
            printf '%s\n' \
              'server-production-tls13=FAIL test=runtime.generated-tls-context-negotiates-tls13' \
              | tee -a "$result_file"
            overall_status=1
          fi

          run_tls_profile credssp-tls-system-default \
            security.windows-credssp-tls-system-default system-default || overall_status=1
          run_tls_profile credssp-tls12-only-server \
            security.windows-credssp-tls12-only-server tls12-only || overall_status=1
          run_tls_profile credssp-tls13-only-server \
            security.windows-credssp-tls13-only-server tls13-only || overall_status=1

          default_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=system-default ' "$result_file")"
          tls12_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=tls12-only ' "$result_file")"
          tls13_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=tls13-only ' "$result_file")"
          grep -Fq 'schannel=SCHANNEL_CRED status=PASS' <<< "$default_receipt"
          grep -Fq 'first-tsrequest=yes type1=yes type2-committed=yes next-tsrequest=yes type3=yes' <<< "$default_receipt"
          grep -Fq 'schannel=SCHANNEL_CRED status=PASS negotiated-tls=TLS1.2' <<< "$tls12_receipt"
          grep -Fq 'first-tsrequest=yes type1=yes type2-committed=yes next-tsrequest=yes type3=yes' <<< "$tls12_receipt"
          grep -Fq 'schannel=SCH_CREDENTIALS-system-defaults' <<< "$tls13_receipt"
          grep -Eq 'status=(PASS|ORACLE_LIMITATION)' <<< "$tls13_receipt"
          grep -Fq 'physical-reference-tls=TLS1.3 physical-reference-cipher=TLS_AES_256_GCM_SHA384' <<< "$tls13_receipt"
          if grep -Fq 'status=PASS' <<< "$tls13_receipt"; then
            grep -Fq 'negotiated-tls=TLS1.3' <<< "$tls13_receipt"
            grep -Fq 'first-tsrequest=yes type1=yes type2-committed=yes next-tsrequest=yes type3=yes' <<< "$tls13_receipt"
          else
            grep -Fq 'status=ORACLE_LIMITATION negotiated-tls=none' <<< "$tls13_receipt"
            grep -Fq 'first-tsrequest=no type1=no type2-committed=no next-tsrequest=no type3=no' <<< "$tls13_receipt"
          fi
          printf 'Microsoft CredSSP TLS-version matrix:\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$result_file" >> "$GITHUB_STEP_SUMMARY"
          exit "$overall_status"

      - name: Probe modern Schannel credentials in Microsoft full CredSSP
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test_name='security.windows-credssp-modern-schannel-system-defaults-full-boundary-probe'
          selector="^${test_name//./[.]}$"
          inventory="$(ctest --test-dir build --build-config Debug -N -R "$selector")"
          printf '%s\n' "$inventory"
          grep -Fq ": $test_name" <<< "$inventory"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$inventory")" -eq 1
          probe_output='build/r9-modern-schannel-probe.txt'
          ctest --test-dir build --build-config Debug --timeout 45 \
            -R "$selector" --verbose 2>&1 | tee "$probe_output"

      - name: Primary Microsoft Windows NTLM and CredSSP target differential
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          selector='^security[.]windows-(sspi-production-type2-(interop|physical-ip-target|oem-omission-differential)|credssp-(credential-semantic-differential|type2-required-av-negative-controls|production-full-exchange|server-binding-mismatch-negative-control|production-(control-target|physical-ip-target|bare-ip-target)-next-token))$'
          inventory="$(ctest --test-dir build --build-config Debug -N -R "$selector")"
          printf '%s\n' "$inventory"
          for required_test in \
            security.windows-sspi-production-type2-interop \
            security.windows-sspi-production-type2-physical-ip-target \
            security.windows-sspi-production-type2-oem-omission-differential \
            security.windows-credssp-credential-semantic-differential \
            security.windows-credssp-type2-required-av-negative-controls \
            security.windows-credssp-production-full-exchange \
            security.windows-credssp-server-binding-mismatch-negative-control \
            security.windows-credssp-production-control-target-next-token \
            security.windows-credssp-production-physical-ip-target-next-token \
            security.windows-credssp-production-bare-ip-target-next-token; do
            grep -Fq ": $required_test" <<< "$inventory"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$inventory")" -eq 10
          result_file='build/r9-microsoft-interop-results.txt'
          tls_version_result_file='build/r9-credssp-tls-version-results.txt'
          test -f "$tls_version_result_file"
          : > "$result_file"
          printf 'interop-matrix-begin=PARTIAL source-sha=%s workflow-run=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$result_file"
          cat "$tls_version_result_file" >> "$result_file"

          modern_probe_output='build/r9-modern-schannel-probe.txt'
          test -f "$modern_probe_output"
          modern_probe_line="$(grep -Eo 'microsoft-credssp-modern-schannel-probe .*' "$modern_probe_output" | tail -n 1)"
          legacy_tls_line="$(grep -Eo 'microsoft-credssp-tls-profile target=TERMSRV/RDP-SERVER schannel=SCHANNEL_CRED server-profile=system-default negotiated-tls=[^ ]+ .*' "$modern_probe_output" | tail -n 1)"
          test -n "$modern_probe_line"
          test -n "$legacy_tls_line"
          grep -Eq 'modern-result=(TLS13_TYPE3_PASS|TYPE3_PASS_NON_TLS13|FAILED_BEFORE_TYPE3)' <<< "$modern_probe_line"
          grep -Eq 'tls13-type3-pass=(yes|no)' <<< "$modern_probe_line"
          legacy_tls_version="$(sed -n 's/.* negotiated-tls=\([^ ]*\).*/\1/p' <<< "$legacy_tls_line")"
          modern_tls_version="$(sed -n 's/.* tls=\([^ ]*\).*/\1/p' <<< "$modern_probe_line")"
          test -n "$legacy_tls_version"
          test -n "$modern_tls_version"

          tls13_matrix_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=tls13-only ' "$tls_version_result_file")"
          test -n "$tls13_matrix_receipt"
          tls13_external_oracle=NOT_QUALIFIED
          tls12_only_physical_ab=JUSTIFIED
          if grep -Fq 'status=PASS negotiated-tls=TLS1.3' <<< "$tls13_matrix_receipt" || \
             [[ "$legacy_tls_version" == TLSv1.3 ]] || \
             grep -Fq 'tls13-type3-pass=yes' <<< "$modern_probe_line"; then
            tls13_external_oracle=PASS
            tls12_only_physical_ab=NOT_JUSTIFIED
          elif [[ "$modern_tls_version" == TLSv1.3 ]]; then
            tls13_external_oracle=FAIL
          fi

          printf 'credssp-modern-%s\n' "$modern_probe_line" | tee -a "$result_file"
          printf '%s\n' \
            "tls-version-differential=TYPED physical-tls=TLSv1.3 hosted-legacy-tls=$legacy_tls_version modern-tls=$modern_tls_version tls13-external-oracle=$tls13_external_oracle tls12-only-physical-ab=$tls12_only_physical_ab production-tls-change-authorized=no" \
            | tee -a "$result_file"
          printf '%s\n' \
            'physical-owner-type1-profile=OBSERVED bytes=40 flags=0xe2088235 version=6.0.6001/0x0f domain-supplied=no workstation-supplied=no' \
            | tee -a "$result_file"

          run_case() {
            local result_key="$1"
            local test_name="$2"
            local output_file="${3:-}"
            local escaped_test_name="${test_name//./[.]}"
            if [[ -n "$output_file" ]]; then
              if ctest --test-dir build --build-config Debug --timeout 45 \
                  -R "^${escaped_test_name}$" --verbose 2>&1 | tee "$output_file"; then
                printf '%s=PASS test=%s\n' "$result_key" "$test_name" | tee -a "$result_file"
                return 0
              fi
            elif ctest --test-dir build --build-config Debug --timeout 45 \
                -R "^${escaped_test_name}$" --verbose; then
              printf '%s=PASS test=%s\n' "$result_key" "$test_name" | tee -a "$result_file"
              return 0
            fi
            printf '%s=FAIL test=%s\n' "$result_key" "$test_name" | tee -a "$result_file"
            return 1
          }
          overall_status=0
          run_case ntlm-fixed-name security.windows-sspi-production-type2-interop || overall_status=1
          run_case ntlm-ip-target security.windows-sspi-production-type2-physical-ip-target || overall_status=1
          oem_output='build/r9-ntlm-oem-omission-differential.txt'
          if run_case ntlm-oem-omission security.windows-sspi-production-type2-oem-omission-differential "$oem_output"; then
            oem_line="$(grep -Eo 'microsoft-sspi-oem-omission-differential .*' "$oem_output" | tail -n 1)"
            test -n "$oem_line"
            grep -Fq 'client-offered-oem=yes' <<< "$oem_line"
            grep -Fq 'only-oem-response-bit-removed=yes' <<< "$oem_line"
            grep -Fq 'version-omitted=yes' <<< "$oem_line"
            grep -Fq 'target-name-unchanged=yes' <<< "$oem_line"
            grep -Fq 'target-info-unchanged=yes' <<< "$oem_line"
            grep -Fq 'timestamp-unchanged=yes' <<< "$oem_line"
            grep -Fq 'timestamp-age-recorded=yes' <<< "$oem_line"
            grep -Eq 'timestamp-age-ms=[0-9]+' <<< "$oem_line"
            grep -Fq 'type3=yes' <<< "$oem_line"
            grep -Fq 'qualified=yes' <<< "$oem_line"
            printf 'ntlm-oem-%s physical-type1-flags=0xe2088235 physical-type2-flags=0xe08a8235\n' "$oem_line" | tee -a "$result_file"
            printf '%s\n' \
              'physical-flag-oem-differential=TYPED physical-type1-flags=0xe2088235 physical-type2-flags=0xe08a8235 microsoft-oem-omission=PASS oem-response-bit-difference-ruled-out=yes' \
              | tee -a "$result_file"
          else
            overall_status=1
          fi
          credential_semantic_output='build/r9-credssp-credential-semantics.txt'
          if run_case credssp-credential-semantics security.windows-credssp-credential-semantic-differential "$credential_semantic_output"; then
            for credential_state in correct wrong-password empty-password unavailable-no-spnego; do
              credential_line="$(grep -Eo "microsoft-credssp-credential-semantics credential-state=${credential_state} .*" "$credential_semantic_output" | tail -n 1)"
              test -n "$credential_line"
              grep -Eq 'outcome=(TYPE3_EMITTED|FAILED_BEFORE_TYPE1|POST_TYPE2_NO_TYPE3|OTHER_TYPED_TERMINAL)' <<< "$credential_line"
              grep -Eq 'acquire-status=[A-Z0-9_]+ acquire-code=0x[0-9a-fA-F]{8}' <<< "$credential_line"
              grep -Eq 'first-isc-called=(yes|no) first-isc-status=[A-Z0-9_]+' <<< "$credential_line"
              grep -Eq 'first-tsrequest=(yes|no) type1=(yes|no) type2-consumed=(yes|no) next-client-output=(yes|no) type3=(yes|no)' <<< "$credential_line"
              grep -Eq 'terminal-status=[A-Z0-9_]+ terminal-code=0x[0-9a-fA-F]{8}' <<< "$credential_line"
              grep -Eq 'elapsed-us=[0-9]+' <<< "$credential_line"
              grep -Fq 'production-type2-change-authorized=no' <<< "$credential_line"
              printf 'credential-semantic-%s\n' "$credential_line" | tee -a "$result_file"
            done
            correct_credential_line="$(grep '^credential-semantic-microsoft-credssp-credential-semantics credential-state=correct ' "$result_file")"
            grep -Fq 'outcome=TYPE3_EMITTED' <<< "$correct_credential_line"
            grep -Fq 'first-tsrequest=yes type1=yes type2-consumed=yes next-client-output=yes type3=yes' <<< "$correct_credential_line"

            default_credential_line="$(grep -Eo 'microsoft-credssp-credential-semantics credential-state=default-credential .*' "$credential_semantic_output" | tail -n 1)"
            test -n "$default_credential_line"
            grep -Fq 'outcome=NOT_RUN_POLICY' <<< "$default_credential_line"
            grep -Fq 'hosted-runner-credentials-used=no' <<< "$default_credential_line"
            printf 'credential-semantic-%s\n' "$default_credential_line" | tee -a "$result_file"

            semantic_summary="$(grep -Eo 'microsoft-credssp-credential-semantics-summary .*' "$credential_semantic_output" | tail -n 1)"
            test -n "$semantic_summary"
            grep -Fq 'status=PASS correct-control=TYPE3' <<< "$semantic_summary"
            grep -Eq 'physical-sequence-match=(yes|no)' <<< "$semantic_summary"
            grep -Eq 'leading-comparison=[^ ]+' <<< "$semantic_summary"
            grep -Eq 'unavailable-no-spnego-match=(yes|no|inconclusive)' <<< "$semantic_summary"
            grep -Eq 'all-noncontrol-type3-or-pretype1=(yes|no)' <<< "$semantic_summary"
            grep -Fq 'default-credential=NOT_RUN_POLICY' <<< "$semantic_summary"
            grep -Fq 'production-type2-change-authorized=no' <<< "$semantic_summary"
            printf 'credential-semantic-summary-%s\n' "$semantic_summary" | tee -a "$result_file"
          else
            overall_status=1
          fi

          type2_negative_output='build/r2-credssp-type2-negative-controls.txt'
          if run_case credssp-type2-required-av-negative-controls security.windows-credssp-type2-required-av-negative-controls "$type2_negative_output"; then
            for experiment in missing-msv-av-nb-computer-name missing-msv-av-nb-domain-name; do
              negative_line="$(grep -Eo "microsoft-credssp-type2-negative-control experiment=${experiment} .*" "$type2_negative_output" | tail -n 1)"
              test -n "$negative_line"
              grep -Fq 'challenge-committed=yes' <<< "$negative_line"
              grep -Fq 'type2-consumed=yes' <<< "$negative_line"
              grep -Fq 'type3=no' <<< "$negative_line"
              grep -Fq 'oracle-detected=yes' <<< "$negative_line"
              printf 'type2-negative-%s\n' "$negative_line" | tee -a "$result_file"
            done
            negative_summary="$(grep -Eo 'microsoft-credssp-type2-negative-controls .*' "$type2_negative_output" | tail -n 1)"
            test -n "$negative_summary"
            grep -Fq 'control=TYPE3' <<< "$negative_summary"
            grep -Fq 'invalid-controls=DETECTED' <<< "$negative_summary"
            grep -Fq 'status=PASS' <<< "$negative_summary"
            grep -Fq 'process-isolation=per-challenge' <<< "$negative_summary"
            grep -Fq 'production-type2-change-authorized=no' <<< "$negative_summary"
            printf 'type2-negative-summary-%s\n' "$negative_summary" | tee -a "$result_file"
          else
            overall_status=1
          fi

          full_exchange_output='build/r6-credssp-full-exchange.txt'
          full_exchange_status=0
          run_case credssp-full-production-exchange security.windows-credssp-production-full-exchange "$full_exchange_output" || full_exchange_status=$?
          full_exchange_line="$(grep -Eo 'microsoft-credssp-full-exchange .*' "$full_exchange_output" | tail -n 1 || true)"
          if [[ -n "$full_exchange_line" ]]; then
            authinfo_failure="$(sed -n 's/.* production-authinfo-failure=\([^ ]*\).*/\1/p' <<< "$full_exchange_line")"
            case "$authinfo_failure" in
              none|frame-or-session|protected-length|sign-seal|credential-der-or-fields|credential-unclassified|credential-envelope-der|password-credential-fields|unsupported-credential-type|nonempty-delegated-domain|credential-unavailable|credential-identity-or-password-mismatch|frame-release)
                printf 'credssp-full-production-authinfo-failure=%s\n' "$authinfo_failure" | tee -a "$result_file"
                ;;
              *)
                printf 'credssp-full-production-authinfo-failure=INVALID_OR_MISSING\n' | tee -a "$result_file"
                overall_status=1
                ;;
            esac

            authinfo_empty_fields="$(sed -n 's/.* production-authinfo-empty-fields=\([^ ]*\).*/\1/p' <<< "$full_exchange_line")"
            case "$authinfo_empty_fields" in
              none|empty-username|empty-password|both-empty)
                printf 'credssp-full-production-authinfo-empty-fields=%s\n' "$authinfo_empty_fields" | tee -a "$result_file"
                ;;
              *)
                printf 'credssp-full-production-authinfo-empty-fields=INVALID_OR_MISSING\n' | tee -a "$result_file"
                overall_status=1
                ;;
            esac

            # Agent 6 emits only bounded request/final-return scalars. The
            # returned flag is inspected by the fixture only after the final
            # successful InitializeSecurityContextW call.
            delegation_requested="$(sed -n 's/.* delegation-requested=\([^ ]*\).*/\1/p' <<< "$full_exchange_line")"
            case "$delegation_requested" in
              yes|no)
                printf 'credssp-full-delegation-requested=%s\n' "$delegation_requested" | tee -a "$result_file"
                ;;
              *)
                printf 'credssp-full-delegation-requested=INVALID_OR_MISSING\n' | tee -a "$result_file"
                overall_status=1
                ;;
            esac
            delegation_returned="$(sed -n 's/.* delegation-returned=\([^ ]*\).*/\1/p' <<< "$full_exchange_line")"
            case "$delegation_returned" in
              yes|no)
                printf 'credssp-full-delegation-returned=%s\n' "$delegation_returned" | tee -a "$result_file"
                ;;
              *)
                printf 'credssp-full-delegation-returned=INVALID_OR_MISSING\n' | tee -a "$result_file"
                overall_status=1
                ;;
            esac
          else
            printf '%s\n' \
              'credssp-full-production-authinfo-failure=SUMMARY_MISSING' \
              'credssp-full-production-authinfo-empty-fields=SUMMARY_MISSING' \
              'credssp-full-delegation-requested=SUMMARY_MISSING' \
              'credssp-full-delegation-returned=SUMMARY_MISSING' \
              | tee -a "$result_file"
            overall_status=1
          fi
          if [[ "$full_exchange_status" -eq 0 ]]; then
            test -n "$full_exchange_line"
            grep -Fq 'status=PASS' <<< "$full_exchange_line"
            grep -Fq 'type3-verified=yes' <<< "$full_exchange_line"
            grep -Fq 'pubkeyauth=yes' <<< "$full_exchange_line"
            grep -Fq 'server-binding-committed=yes' <<< "$full_exchange_line"
            grep -Fq 'authinfo=yes' <<< "$full_exchange_line"
            grep -Fq 'credentials-verified=yes' <<< "$full_exchange_line"
            grep -Fq 'native-admission=no' <<< "$full_exchange_line"
            grep -Fq 'production-authinfo-failure=none' <<< "$full_exchange_line"
            grep -Fq 'production-authinfo-empty-fields=none' <<< "$full_exchange_line"
            grep -Fq 'delegation-requested=yes' <<< "$full_exchange_line"
            grep -Eq 'delegation-returned=(yes|no)' <<< "$full_exchange_line"
            printf 'credssp-full-exchange-%s\n' "$full_exchange_line" | tee -a "$result_file"
          else
            overall_status=1
          fi

          binding_negative_output='build/r6-credssp-binding-negative.txt'
          if run_case credssp-server-binding-negative security.windows-credssp-server-binding-mismatch-negative-control "$binding_negative_output"; then
            binding_negative_line="$(grep -Eo 'microsoft-credssp-binding-negative-control .*' "$binding_negative_output" | tail -n 1)"
            test -n "$binding_negative_line"
            grep -Fq 'challenge=production' <<< "$binding_negative_line"
            grep -Fq 'type3=yes' <<< "$binding_negative_line"
            grep -Fq 'pubkeyauth=yes' <<< "$binding_negative_line"
            grep -Fq 'invalid-binding-committed=yes' <<< "$binding_negative_line"
            grep -Fq 'authinfo=no' <<< "$binding_negative_line"
            grep -Fq 'credentials-verified=no' <<< "$binding_negative_line"
            grep -Fq 'delegation-requested=yes delegation-returned=no' <<< "$binding_negative_line"
            grep -Fq 'oracle-detected=yes' <<< "$binding_negative_line"
            grep -Fq 'production-binding-change-authorized=no' <<< "$binding_negative_line"
            printf 'credssp-binding-negative-%s\n' "$binding_negative_line" | tee -a "$result_file"
          else
            overall_status=1
          fi

          control_output='build/r9-credssp-fixed-name-control.txt'
          if run_case credssp-fixed-name-control security.windows-credssp-production-control-target-next-token "$control_output"; then
            profile_line="$(grep -Eo 'microsoft-credssp-client-profile-differential target=TERMSRV/RDP-SERVER .*' "$control_output" | tail -n 1)"
            test -n "$profile_line"
            grep -Fq 'physical-type1-flags=0xe2088235' <<< "$profile_line"
            grep -Fq 'physical-type1-bytes=40' <<< "$profile_line"
            grep -Fq 'type1-exact-equality-required=no' <<< "$profile_line"
            grep -Eq 'hosted-type1-bytes=[1-9][0-9]*' <<< "$profile_line"
            grep -Eq 'hosted-version-structure=(valid|absent)' <<< "$profile_line"
            printf 'credssp-fixed-name-%s\n' "$profile_line" | tee -a "$result_file"
            printf 'interop-type1-type2-profile=%s\n' "$profile_line" | tee -a "$result_file"
            run_case credssp-ip-spn-target security.windows-credssp-production-physical-ip-target-next-token || overall_status=1
            run_case credssp-bare-ip-target security.windows-credssp-production-bare-ip-target-next-token || overall_status=1
            printf 'credssp-target-differential=TYPED\n' | tee -a "$result_file"
          else
            overall_status=1
            printf '%s\n' \
              'credssp-ip-spn-target=BLOCKED_CONTROL test=security.windows-credssp-production-physical-ip-target-next-token' \
              'credssp-bare-ip-target=BLOCKED_CONTROL test=security.windows-credssp-production-bare-ip-target-next-token' \
              'credssp-target-differential=BLOCKED_CONTROL' | tee -a "$result_file"
          fi
          if [ "$overall_status" -eq 0 ]; then
            printf 'interop-matrix-final=COMPLETE_PASS source-sha=%s\n' "$GITHUB_SHA" \
              | tee -a "$result_file"
          else
            printf 'interop-matrix-final=INCOMPLETE_FAIL source-sha=%s\n' "$GITHUB_SHA" \
              | tee -a "$result_file"
          fi
          printf 'Microsoft NTLM/CredSSP candidate matrix:\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$result_file" >> "$GITHUB_STEP_SUMMARY"
          exit "$overall_status"

      - name: Upload exact-SHA Microsoft interop result matrix
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: r9-microsoft-interop-${{ github.sha }}
          path: build/r9-microsoft-interop-results.txt
          if-no-files-found: error
      - name: Preflight and run focused R7 macOS lifecycle tests (Debug)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          r7_focus='^(macos\.desktop-geometry-epoch-generation-fence-revocation|macos\.capture-stream-(geometry-generation-retirement|callback-retirement|consumer-cancellation|native-stop-single-ownership|backend-callback-reentry-retirement|start-retirement-after-completion|session-watch-frame-retirement|session-watch-consumer-race)|macos\.capture-(bgra-layout-contract|pixel-lifetime-retirement|display-generation-denials)|macos\.cursor-(session-watch-revocation|topology-publication-revocation|geometry-generation-publication-denials)|macos\.input-controller-(session-watch-revocation|authority-retirement-no-native-post)|macos\.desktop-session-(switch-away-back-revocation|mid-operation-epoch-change|watch-retirement-callback-race|watch-destructor-retirement))$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$r7_focus")"
          printf '%s\n' "$selected_tests"
          for required_test in \
            macos.desktop-geometry-epoch-generation-fence-revocation \
            macos.capture-stream-geometry-generation-retirement \
            macos.capture-stream-callback-retirement \
            macos.capture-stream-consumer-cancellation \
            macos.capture-stream-native-stop-single-ownership \
            macos.capture-stream-backend-callback-reentry-retirement \
            macos.capture-stream-start-retirement-after-completion \
            macos.capture-stream-session-watch-frame-retirement \
            macos.capture-stream-session-watch-consumer-race \
            macos.capture-bgra-layout-contract \
            macos.capture-pixel-lifetime-retirement \
            macos.capture-display-generation-denials \
            macos.cursor-session-watch-revocation \
            macos.cursor-topology-publication-revocation \
            macos.cursor-geometry-generation-publication-denials \
            macos.input-controller-session-watch-revocation \
            macos.input-controller-authority-retirement-no-native-post \
            macos.desktop-session-switch-away-back-revocation \
            macos.desktop-session-mid-operation-epoch-change \
            macos.desktop-session-watch-retirement-callback-race \
            macos.desktop-session-watch-destructor-retirement; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$r7_focus" --output-on-failure
      - name: Run Debug protocol and project-policy tests
        run: ctest --test-dir build --build-config Debug --timeout 60 --output-on-failure

      # Reconfigure the SAME build root for the release artifact. Never
      # create a parallel local or CI top-level build directory.
      - name: Reconfigure Release in same build root
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=OFF' build/CMakeCache.txt
      - name: Compile Release
        run: cmake --build build --config Release --parallel 2
      - name: Preflight and run focused R7 macOS lifecycle tests (Release)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          r7_focus='^(macos\.desktop-geometry-epoch-generation-fence-revocation|macos\.capture-stream-(geometry-generation-retirement|callback-retirement|consumer-cancellation|native-stop-single-ownership|backend-callback-reentry-retirement|start-retirement-after-completion|session-watch-frame-retirement|session-watch-consumer-race)|macos\.capture-(bgra-layout-contract|pixel-lifetime-retirement|display-generation-denials)|macos\.cursor-(session-watch-revocation|topology-publication-revocation|geometry-generation-publication-denials)|macos\.input-controller-(session-watch-revocation|authority-retirement-no-native-post)|macos\.desktop-session-(switch-away-back-revocation|mid-operation-epoch-change|watch-retirement-callback-race|watch-destructor-retirement))$'
          selected_tests="$(ctest --test-dir build --build-config Release -N -R "$r7_focus")"
          printf '%s\n' "$selected_tests"
          for required_test in \
            macos.desktop-geometry-epoch-generation-fence-revocation \
            macos.capture-stream-geometry-generation-retirement \
            macos.capture-stream-callback-retirement \
            macos.capture-stream-consumer-cancellation \
            macos.capture-stream-native-stop-single-ownership \
            macos.capture-stream-backend-callback-reentry-retirement \
            macos.capture-stream-start-retirement-after-completion \
            macos.capture-stream-session-watch-frame-retirement \
            macos.capture-stream-session-watch-consumer-race \
            macos.capture-bgra-layout-contract \
            macos.capture-pixel-lifetime-retirement \
            macos.capture-display-generation-denials \
            macos.cursor-session-watch-revocation \
            macos.cursor-topology-publication-revocation \
            macos.cursor-geometry-generation-publication-denials \
            macos.input-controller-session-watch-revocation \
            macos.input-controller-authority-retirement-no-native-post \
            macos.desktop-session-switch-away-back-revocation \
            macos.desktop-session-mid-operation-epoch-change \
            macos.desktop-session-watch-retirement-callback-race \
            macos.desktop-session-watch-destructor-retirement; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          ctest --test-dir build --build-config Release --timeout 60 \
            -R "$r7_focus" --output-on-failure
      - name: Run Release protocol tests
        run: ctest --test-dir build --build-config Release --timeout 60 --output-on-failure
      - name: Stage installable protocol SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/build/stage"
      - name: Verify downstream CMake package, link and execution
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/consumer -B build/consumer \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build/stage" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer --config Release --parallel 2
          ctest --test-dir build/consumer --build-config Release --timeout 60 --output-on-failure
      - name: Package ZIP protocol SDK
        run: cmake --build build --config Release --target package
      - name: Generate reproducible artifact digest
        shell: bash
        run: |
          set -euo pipefail
          cd build
          cmake -E sha256sum rdp-server-protocol-*.zip > "SHA256SUMS-${{ matrix.os }}.txt"
      # R7 non-serving Mac test bundle uses only the architecture actually built.
      - name: Package verified macOS protocol TEST BUNDLE
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find build/stage -type f -name '*.a' -print -quit)"
          test -n "$archive"
          architecture="$(lipo -archs "$archive")"
          case "$architecture" in arm64|x86_64) ;; *) echo "unsupported or universal slice: $architecture" >&2; exit 1 ;; esac
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/macos_test_bundle.py package \
            --stage build/stage \
            --output "build/rdp-server-macos-protocol-test-${architecture}-${source_sha}.zip" \
            --source-sha "$source_sha" --version "0.1.0" --minimum-macos "$(sw_vers -productVersion)"
          ctest --test-dir build --build-config Release --timeout 20 \
            -R 'macos[.]package-offline-integrity-and-idempotence' --output-on-failure
      - name: Upload macOS protocol TEST BUNDLE (no server)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-protocol-test-bundle
          path: |
            build/rdp-server-macos-protocol-test-*.zip
            build/rdp-server-macos-protocol-test-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified protocol SDK package
        uses: actions/upload-artifact@v4
        with:
          name: protocol-package-${{ matrix.os }}
          path: |
            build/rdp-server-protocol-*.zip
            build/SHA256SUMS-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 30

      # R9 SERVER-TEST is a distinct startup-disabled preview built from the
      # actual executable after the full Release CTest. It is never the SDK ZIP.
      - name: Build and smoke startup-disabled SERVER-TEST preview
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.server_test_preview && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          python_executable=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_executable=python
          fi
          "$python_executable" scripts/server_test_bundle.py build \
            --source-root . \
            --build-root build \
            --git-sha "$GITHUB_SHA" \
            --build-config Release \
            --output-dir build/server-test
      - name: Upload startup-disabled SERVER-TEST preview
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.server_test_preview && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: server-test-package-${{ matrix.os }}
          path: |
            build/server-test/rdp-server-test-*.zip
            build/server-test/rdp-server-test-*.zip.sha256
            build/server-test/rdp-server-test-*-STATUS.json
            build/server-test/rdp-server-test-*-windows-*-lifecycle.ps1
            build/server-test/rdp-server-test-*-windows-*-lifecycle.ps1.sha256
          if-no-files-found: error
          retention-days: 30


  # R9 cross-platform acceptance for disabled previews only. This job does not
  # publish a release and does not substitute for M1 owner-native or M2 clients.
  server-test-preview-status:
    # Always evaluate producer results on SERVER-TEST preview events. Without
    # always(), a failed dependency silently skips this release-control job.
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.server_test_preview && github.ref == 'refs/heads/main')) }}
    needs: [ci-workflow-structure, protocol]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require SERVER-TEST preview producer success
        env:
          SERVER_TEST_STRUCTURE_RESULT: ${{ needs.ci-workflow-structure.result }}
          SERVER_TEST_PROTOCOL_RESULT: ${{ needs.protocol.result }}
        run: |
          set -euo pipefail
          if [[ "$SERVER_TEST_STRUCTURE_RESULT" != "success" || "$SERVER_TEST_PROTOCOL_RESULT" != "success" ]]; then
            printf 'SERVER-TEST preview prerequisites failed: structure=%s protocol=%s\n' \
              "$SERVER_TEST_STRUCTURE_RESULT" "$SERVER_TEST_PROTOCOL_RESULT" >&2
            exit 1
          fi
      - name: Download three SERVER-TEST preview artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-test-package-*
          merge-multiple: true
          path: build/server-test-acceptance
      - name: Verify exact-SHA SERVER-TEST preview statuses and outer digests
        run: |
          set -euo pipefail
          python3 scripts/server_test_bundle.py verify-statuses \
            --directory build/server-test-acceptance \
            --git-sha "$GITHUB_SHA"
      - name: Upload SERVER-TEST preview acceptance statuses
        uses: actions/upload-artifact@v4
        with:
          name: server-test-status-${{ github.sha }}
          path: build/server-test-acceptance/rdp-server-test-*-STATUS.json
          if-no-files-found: error
          retention-days: 30

  # R6/R10 M1 compiler parity: exercise the ordinary Windows-native adapter
  # graph with the owner's required MSYS2 CLANG64 family. This is hosted
  # compiler/SDK evidence only; it does not replace the owner's persistent
  # ~/rdp-server/build receipt or authorize a live Windows desktop.
  r6-windows-clang23:
    needs: ci-workflow-structure
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-qt6-base
            python
      - name: Verify Clang 23 and MinGW-w64 Windows API packages
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$MSYSTEM" = "CLANG64"
          clang++ --version
          clang++ --version | head -n 1 | grep -Eq 'clang version 23\.'
          cmake --version
          ninja --version
          pacman -Q             mingw-w64-clang-x86_64-clang             mingw-w64-clang-x86_64-headers             mingw-w64-clang-x86_64-crt             mingw-w64-clang-x86_64-libc++             mingw-w64-clang-x86_64-cmake             mingw-w64-clang-x86_64-openssl
      - name: Configure Debug with CLANG64
        id: r9_clang_debug_configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_TESTING=ON             -DRDP_SERVER_BUILD_DESKTOP_GUI=ON             -DCMAKE_C_COMPILER=clang             -DCMAKE_CXX_COMPILER=clang++
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=ON' build/CMakeCache.txt
          grep -E '^CMAKE_C_COMPILER:[^=]+=.*clang(\.exe)?$' build/CMakeCache.txt
          grep -E '^CMAKE_CXX_COMPILER:[^=]+=.*clang\+\+(\.exe)?$' build/CMakeCache.txt
      - name: Run Debug R6 native preflight
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Debug             --target test_windows_desktop_geometry --parallel 2
          selected_tests="$(ctest --test-dir build --build-config Debug -N             -R '^windows\.(geometry|capture|cursor|input)-')"
          printf '%s\n' "$selected_tests"
          for required_test in \
            windows.geometry-single-monitor-native-target-selection \
            windows.capture-session-change-duplication-owner-retirement \
            windows.capture-session-change-duplication-release-order \
            windows.capture-session-change-duplication-callback-retirement \
            windows.capture-session-change-duplication-prior-revocation \
            windows.capture-bgra-layout-contract \
            windows.capture-frame-lifetime-revocation \
            windows.capture-monitor-replacement-denials \
            windows.input-sendinput-authority-retirement-no-native-post; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          test "$(awk '/Test #[0-9]+: windows[.](geometry|capture|cursor|input)-/ { ++count } END { print count + 0 }' \
            <<< "$selected_tests")" -eq 60
          ctest --test-dir build --build-config Debug --timeout 20             -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
      - name: Build Debug CLANG64 test graph
        id: r9_clang_debug_build
        if: ${{ always() && steps.r9_clang_debug_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Debug --parallel 2
      - name: Pin R7 TLS fingerprint Qt regression on Windows
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          selector='^gui[.]offscreen-tls-fingerprint-rotation-and-denials$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': gui.offscreen-tls-fingerprint-rotation-and-denials' <<< "$selected_tests"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")" -eq 1
          ctest --test-dir build --build-config Debug --timeout 30 \
            -R "$selector" --output-on-failure
      - name: Run Debug R10 private-fixture security preflight
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          windows_fixture_selection='^runtime\.windows-private-fixture-'
          windows_fixture_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$windows_fixture_selection")"
          printf '%s\n' "$windows_fixture_tests"
          for required_test in \
            runtime.windows-private-fixture-dacl-creation \
            runtime.windows-private-fixture-broad-access-denials \
            runtime.windows-private-fixture-owner-consistency; do
            grep -Fq "$required_test" <<< "$windows_fixture_tests"
          done
          test "$(awk '/Test #[0-9]+: runtime[.]windows-private-fixture-/ { ++count } END { print count + 0 }' \
            <<< "$windows_fixture_tests")" -eq 3
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$windows_fixture_selection" --output-on-failure

          windows_security_regression='^(runtime\.licensing-context-secure-file-snapshots|runtime\.licensing-cli-valid-provisioning|runtime\.validates-configuration-windows-private-dacl|runtime\.validates-tls-files-private-regular|transport\.tcp-owned-runtime-tls-handshake)$'
          windows_security_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$windows_security_regression")"
          printf '%s\n' "$windows_security_tests"
          for required_test in \
            runtime.licensing-context-secure-file-snapshots \
            runtime.licensing-cli-valid-provisioning \
            runtime.validates-configuration-windows-private-dacl \
            runtime.validates-tls-files-private-regular \
            transport.tcp-owned-runtime-tls-handshake; do
            grep -Fq "$required_test" <<< "$windows_security_tests"
          done
          test "$(awk '/Test #[0-9]+: (runtime[.]licensing-context-secure-file-snapshots|runtime[.]licensing-cli-valid-provisioning|runtime[.]validates-configuration-windows-private-dacl|runtime[.]validates-tls-files-private-regular|transport[.]tcp-owned-runtime-tls-handshake)/ { ++count } END { print count + 0 }' \
            <<< "$windows_security_tests")" -eq 5
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$windows_security_regression" --output-on-failure
      - name: R9 isolate Debug credential-source oracle diagnostics
        id: r9_clang_debug_credssp_semantics
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          selector='^security[.]windows-credssp-credential-semantic-differential$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': security.windows-credssp-credential-semantic-differential' <<< "$selected_tests"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")" -eq 1
          ctest --test-dir build --build-config Debug --timeout 45 \
            -R "$selector" --verbose 2>&1 \
            | tee build/r9-windows-clang23-credential-semantics-debug.txt
      - name: Upload Debug credential-source oracle diagnostics
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: r9-windows-clang23-credential-semantics-${{ github.sha }}
          path: build/r9-windows-clang23-credential-semantics-debug.txt
          if-no-files-found: error
      - name: Run full Debug CTest under CLANG64
        id: r9_clang_debug_ctest
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        shell: msys2 {0}
        run: ctest --test-dir build --build-config Debug --timeout 60 --output-on-failure
      - name: Reconfigure same root for Release
        id: r9_clang_release_configure
        if: ${{ always() && steps.r9_clang_debug_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=ON             -DRDP_SERVER_BUILD_DESKTOP_GUI=ON             -DCMAKE_C_COMPILER=clang             -DCMAKE_CXX_COMPILER=clang++
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=ON' build/CMakeCache.txt
      - name: Run Release R6 native preflight
        if: ${{ always() && steps.r9_clang_release_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Release             --target test_windows_desktop_geometry --parallel 2
          selected_tests="$(ctest --test-dir build --build-config Release -N             -R '^windows\.(geometry|capture|cursor|input)-')"
          printf '%s\n' "$selected_tests"
          for required_test in \
            windows.geometry-single-monitor-native-target-selection \
            windows.capture-session-change-duplication-owner-retirement \
            windows.capture-session-change-duplication-release-order \
            windows.capture-session-change-duplication-callback-retirement \
            windows.capture-session-change-duplication-prior-revocation \
            windows.capture-bgra-layout-contract \
            windows.capture-frame-lifetime-revocation \
            windows.capture-monitor-replacement-denials \
            windows.input-sendinput-authority-retirement-no-native-post; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          test "$(awk '/Test #[0-9]+: windows[.](geometry|capture|cursor|input)-/ { ++count } END { print count + 0 }' \
            <<< "$selected_tests")" -eq 60
          ctest --test-dir build --build-config Release --timeout 20             -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
      - name: Build Release CLANG64 test graph
        id: r9_clang_release_build
        if: ${{ always() && steps.r9_clang_release_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2
      - name: Run Release R10 private-fixture security preflight
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          windows_fixture_selection='^runtime\.windows-private-fixture-'
          windows_fixture_tests="$(ctest --test-dir build --build-config Release -N \
            -R "$windows_fixture_selection")"
          printf '%s\n' "$windows_fixture_tests"
          for required_test in \
            runtime.windows-private-fixture-dacl-creation \
            runtime.windows-private-fixture-broad-access-denials \
            runtime.windows-private-fixture-owner-consistency; do
            grep -Fq "$required_test" <<< "$windows_fixture_tests"
          done
          test "$(awk '/Test #[0-9]+: runtime[.]windows-private-fixture-/ { ++count } END { print count + 0 }' \
            <<< "$windows_fixture_tests")" -eq 3
          ctest --test-dir build --build-config Release --timeout 60 \
            -R "$windows_fixture_selection" --output-on-failure

          windows_security_regression='^(runtime\.licensing-context-secure-file-snapshots|runtime\.licensing-cli-valid-provisioning|runtime\.validates-configuration-windows-private-dacl|runtime\.validates-tls-files-private-regular|transport\.tcp-owned-runtime-tls-handshake)$'
          windows_security_tests="$(ctest --test-dir build --build-config Release -N \
            -R "$windows_security_regression")"
          printf '%s\n' "$windows_security_tests"
          for required_test in \
            runtime.licensing-context-secure-file-snapshots \
            runtime.licensing-cli-valid-provisioning \
            runtime.validates-configuration-windows-private-dacl \
            runtime.validates-tls-files-private-regular \
            transport.tcp-owned-runtime-tls-handshake; do
            grep -Fq "$required_test" <<< "$windows_security_tests"
          done
          test "$(awk '/Test #[0-9]+: (runtime[.]licensing-context-secure-file-snapshots|runtime[.]licensing-cli-valid-provisioning|runtime[.]validates-configuration-windows-private-dacl|runtime[.]validates-tls-files-private-regular|transport[.]tcp-owned-runtime-tls-handshake)/ { ++count } END { print count + 0 }' \
            <<< "$windows_security_tests")" -eq 5
          ctest --test-dir build --build-config Release --timeout 60 \
            -R "$windows_security_regression" --output-on-failure
      - name: Run full Release CTest under CLANG64
        id: r9_clang_release_ctest
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: ctest --test-dir build --build-config Release --timeout 60 --output-on-failure
      # R7/R6 non-collecting credential UI must remain registered on Windows.
      - name: R9 pin Windows unsupported-password GUI CTest
        id: r9_windows_unsupported_password_gui
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          selector='^windows[.]gui-independent-password-input-unavailable$'
          selected_tests="$(ctest --test-dir build --build-config Release -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': windows.gui-independent-password-input-unavailable' <<< "$selected_tests"
          selected_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_count" -ne 1 ]]; then
            printf 'R9 Windows unsupported-password registry mismatch: expected 1, found %s\n' "$selected_count" >&2
            exit 1
          fi
          ctest --test-dir build --build-config Release --timeout 30 \
            -R "$selector" --output-on-failure

      - name: R9 package native Windows GUI and verify PE closure
        id: r9_windows_gui_package
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -Q mingw-w64-clang-x86_64-qt6-base python
          cmake --build build --config Release \
            --target rdp-server-windows-gui --parallel 2
          test -f build/RDP-server-GUI.exe
          if command -v windeployqt6.exe >/dev/null 2>&1; then
            windeployqt="$(command -v windeployqt6.exe)"
          else
            windeployqt="$(command -v windeployqt.exe)"
          fi
          objdump="$(command -v llvm-objdump.exe)"
          version="$(sed -n 's/^project(RDP_server VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          archive="build/rdp-server-portable-gui-$version-windows-x86_64-$short_sha.zip"
          python packaging/windows/gui_bundle.py \
            --gui build/RDP-server-GUI.exe \
            --windeployqt "$windeployqt" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --output "$archive"
          outer_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test -n "$outer_sha"
          grep -Fqx "$outer_sha  $(basename "$archive")" "$archive.sha256"
          python scripts/verify_portable_gui.py \
            --archive "$archive" \
            --git-sha "$GITHUB_SHA" \
            --outer-sha256 "$outer_sha"
          extracted="build/Extracted PORTABLE GUI"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          python -m zipfile -e "$archive" "$extracted"
          python scripts/verify_windows_pe_closure.py \
            --root "$extracted" --objdump "$objdump"
      - name: R9 smoke extracted Windows GUI offline without sockets
        id: r9_windows_gui_smoke
        if: ${{ always() && steps.r9_windows_gui_package.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/smoke_windows_portable_gui.ps1 -Root (Join-Path $PWD "build\Extracted PORTABLE GUI")
      # Publish only after the extracted offline Windows smoke has passed.
      # Keep PORTABLE-GUI separate from SDK and startup-disabled SERVER-TEST.
      - name: Stage Windows PORTABLE-GUI candidate (internal only)
        if: ${{ always() && steps.r9_windows_gui_package.outcome == 'success' && steps.r9_windows_gui_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: r9-windows-unverified-${{ github.sha }}
          path: |
            build/rdp-server-portable-gui-*-windows-x86_64-*.zip
            build/rdp-server-portable-gui-*-windows-x86_64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Reconfigure same root for R6 Windows sanitizers
        id: r6_windows_sanitizer_configure
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build R6 Windows native sanitizer fixture
        id: r6_windows_sanitizer_build
        if: ${{ always() && steps.r6_windows_sanitizer_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Debug \
            --target test_windows_desktop_geometry --parallel 2
      - name: Run R6 Windows native lifetime CTests with sanitizers
        id: r6_windows_sanitizer_ctest
        if: ${{ always() && steps.r6_windows_sanitizer_build.outcome == 'success' }}
        shell: msys2 {0}
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          r6_sanitizer_selection='^windows\.(geometry|capture|cursor|input)-'
          r6_sanitizer_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$r6_sanitizer_selection")"
          printf '%s\n' "$r6_sanitizer_tests"
          for required_test in \
            windows.geometry-single-monitor-native-target-selection \
            windows.capture-session-change-duplication-owner-retirement \
            windows.capture-session-change-duplication-release-order \
            windows.capture-session-change-duplication-callback-retirement \
            windows.capture-session-change-duplication-prior-revocation \
            windows.capture-bgra-layout-contract \
            windows.capture-frame-lifetime-revocation \
            windows.capture-monitor-replacement-denials \
            windows.input-sendinput-authority-retirement-no-native-post; do
            grep -Fq "$required_test" <<< "$r6_sanitizer_tests"
          done
          test "$(awk '/Test #[0-9]+: windows[.](geometry|capture|cursor|input)-/ { ++count } END { print count + 0 }' \
            <<< "$r6_sanitizer_tests")" -eq 60
          ctest --test-dir build --build-config Debug --timeout 20 \
            -R "$r6_sanitizer_selection" --output-on-failure
      - name: R9 require Windows CLANG64 exact-SHA qualification
        if: ${{ always() }}
        shell: msys2 {0}
        env:
          CREDENTIAL_DIAGNOSTIC: ${{ steps.r9_clang_debug_credssp_semantics.outcome }}
          DEBUG_CTEST: ${{ steps.r9_clang_debug_ctest.outcome }}
          RELEASE_CTEST: ${{ steps.r9_clang_release_ctest.outcome }}
          UNSUPPORTED_PASSWORD_GUI: ${{ steps.r9_windows_unsupported_password_gui.outcome }}
          GUI_PACKAGE: ${{ steps.r9_windows_gui_package.outcome }}
          GUI_SMOKE: ${{ steps.r9_windows_gui_smoke.outcome }}
          NATIVE_SANITIZERS: ${{ steps.r6_windows_sanitizer_ctest.outcome }}
        run: |
          set -euo pipefail
          for result in \
            "$CREDENTIAL_DIAGNOSTIC" \
            "$DEBUG_CTEST" \
            "$RELEASE_CTEST" \
            "$UNSUPPORTED_PASSWORD_GUI" \
            "$GUI_PACKAGE" \
            "$GUI_SMOKE" \
            "$NATIVE_SANITIZERS"; do
            test "$result" = success
          done
          printf 'R9 WINDOWS CLANG64 QUALIFICATION PASS: %s\n' "$GITHUB_SHA"

  # R9: one bounded sanitizer job across existing first-party CLIPRDR/X11,
  # MCS/CredSSP, native R2->R3 admission/revocation and R3 licensing contracts.
  r9-security-protocol-sanitizers:
    needs: ci-workflow-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Clang sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v clang++
          clang --version
          clang++ --version
      - name: Install credential-free Linux GSSAPI build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libkrb5-dev libpam0g-dev libsystemd-dev pkg-config \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-damage0-dev libxcb-xtest0-dev \
            libxcb-xinput-dev xvfb xauth
      - name: Configure first-party protocol tests with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF \
            -DRDP_SERVER_TEST_LINUX_GSSAPI=ON \
            -DRDP_SERVER_TEST_LINUX_PAM=ON \
            -DRDP_SERVER_TEST_REAL_KERBEROS=OFF \
            -DRDP_SERVER_BUILD_FUZZERS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Compile existing production-linked protocol test targets
        id: compile_protocol_tests
        run: |
          cmake --build build --config Debug --parallel 2 --target \
            test_owned_remote_transfer test_clipboard_protocol \
            test_r3_clipboard_static_channel test_r8_r3_clipboard_bridge \
            test_authentication_attempt_limiter \
            test_windows_clipboard_adapter test_macos_clipboard_adapter \
            test_windows_clipboard_file_destination \
            test_macos_clipboard_file_destination \
            test_linux_clipboard_file_destination \
            test_gfx_surface_lifecycle test_gfx_frame_acknowledge \
            test_gfx_presentation_lifecycle test_gfx_avc420_picture \
            test_gfx_clearcodec_fallback \
            test_gfx_segmented_data test_gfx_avc420_segmented_frame \
            test_gfx_avc420_capabilities \
            test_x264_avc420_encoder \
            test_x264_avc420_segmented_frame_producer \
            test_owned_mcs_connect_initial test_owned_preauth_session \
            test_owned_credssp_tsrequest \
            test_owned_credssp_binding test_console_identity_policy \
            test_standalone_ntlmssp test_standalone_spnego test_standalone_credssp \
            test_linux_runtime_host_control test_lan_listener \
            test_linux_runtime_direct_ntlm_lifecycle \
            test_linux_gssapi_spnego test_linux_pam_password_verifier \
            test_linux_logind_session_identity test_runtime_host_control \
            test_runtime_linux_security test_runtime_io_interest \
            test_runtime_licensing_authority \
            test_runtime_licensing_authority_public_header \
            test_runtime_deployment_policy \
            rdp-server \
            test_x11_clipboard_adapter test_x11_capture_layout \
            test_x11_cursor_reply test_x11_native_capture \
            test_x11_capture_disconnect test_x11_display_events \
            test_x11_native_cursor test_x11_native_damage \
            test_x11_native_input test_x11_pointer_position_tracker \
            test_x11_desktop_resources \
            test_x11_authorized_input_route test_x11_rdp_slow_path_input \
            fuzz_mcs_cliprdr fuzz_credssp
      - name: R9 Microsoft-CSSP negotiation owner-candidate gate
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        shell: bash
        run: |
          set -euo pipefail
          # One exact-SHA gate owns lifecycle plus both MS-CSSP negotiation
