          set -euo pipefail
          native_gss_selection='^security\.gssapi-(configuration-rejections|framed-handoff|console-provenance-before-os-read|native-os-admission-capability-denials|native-admission-r1-nla-provenance-denials|credssp-delegated-account-origin-denials|r3-initial-nla-owner-fence|r1-owned-credssp-provenance-fence|r1-owned-binding-delivery-fence|credssp-authinfo-terminal-denials|r1-owned-credssp-cancellation-fence|r1-owned-completed-frame-cancellation-fence|r3-mcs-admission-contract|r3-protected-transition-generation-fence|r3-connect-response-write-contract|r3-connect-response-completion-reauthorization|r3-erect-domain-contract|r3-attach-user-contract|r3-channel-join-contract|r3-channel-join-terminal-replay-fence|r3-joined-clipboard-role-contract|r3-client-info-route-contract|r3-server-license-request-write-contract|r3-client-licensing-route-contract|r3-server-platform-challenge-write-contract|r3-client-platform-challenge-response-route-contract|r3-attach-user-terminal-replay-fence|r3-protected-transition-terminal-replay-fence|r3-native-change-revocation|r3-mcs-disconnect-revocation-fence)$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$native_gss_selection")"
          printf '%s\n' "$selected_tests"
          readonly native_gss_expected_test_count=30
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$native_gss_expected_test_count" ]]; then
            printf 'R9 M2 native GSS registry mismatch: expected %s tests, found %s\n' \
              "$native_gss_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          grep -Fq 'security.gssapi-credssp-delegated-account-origin-denials' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 --verbose \
            -R "$native_gss_selection" --output-on-failure

      - name: Run R2 Linux PAM verifier denials with sanitizers
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          pam_selection='^security\.(linux-pam-password-verifier-denials|credssp-pam-password-field-verifier-denials|gssapi-pam-verifier-binding-denials)$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$pam_selection")"
          printf '%s\n' "$selected_tests"
          readonly pam_expected_test_count=3
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$pam_expected_test_count" ]]; then
            printf 'R9 M2 PAM registry mismatch: expected %s tests, found %s\n' \
              "$pam_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          grep -Fq 'security.linux-pam-password-verifier-denials' <<< "$selected_tests"
          grep -Fq 'security.credssp-pam-password-field-verifier-denials' <<< "$selected_tests"
          grep -Fq 'security.gssapi-pam-verifier-binding-denials' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$pam_selection" --output-on-failure

      - name: Run all direct R10 Linux runtime security CTests with sanitizers
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # These production-backed runtime-security cases acquire the same MIT
          # GSS service credentials as the native R2 tests. Keep the provider-
          # only leak suppression scoped to this Linux GSS-backed selection.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/r9-mit-krb5-lsan.supp:print_suppressions=1
        run: |
          set -euo pipefail
          runtime_security_selection='^runtime\.(linux-security-(explicit-keytab-continuity|keytab-snapshot-mutation-continuity|keytab-policy-denials|pam-verifier-provisioning)|linux-connection-(credssp-(owner-framing|progress-accounting|revocation-order|authorization-denials)|final-credential-native-admission-denials|pre-admission-dispatch|aggregate-(ordered-revocation|premature-admission-denial)))$'

          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$runtime_security_selection")"
          printf '%s\n' "$selected_tests"
          readonly runtime_security_expected_test_count=12
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$runtime_security_expected_test_count" ]]; then
            printf 'R9 M2 runtime-security registry mismatch: expected %s tests, found %s\n' \
              "$runtime_security_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          grep -Fq 'runtime.linux-security-explicit-keytab-continuity' <<< "$selected_tests"
          grep -Fq 'runtime.linux-security-keytab-snapshot-mutation-continuity' <<< "$selected_tests"
          grep -Fq 'runtime.linux-security-keytab-policy-denials' <<< "$selected_tests"
          grep -Fq 'runtime.linux-security-pam-verifier-provisioning' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-credssp-owner-framing' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-credssp-progress-accounting' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-pre-admission-dispatch' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-credssp-revocation-order' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-credssp-authorization-denials' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-final-credential-native-admission-denials' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-aggregate-ordered-revocation' <<< "$selected_tests"
          grep -Fq 'runtime.linux-connection-aggregate-premature-admission-denial' <<< "$selected_tests"

          ctest --test-dir build --build-config Debug --timeout 60 --verbose \
            -R "$runtime_security_selection" --output-on-failure

      - name: Run all R5 native X11 CTests with sanitizers
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          r5_x11_selection='^x11\.(capture-layout-bounds|cursor-reply-length-bounds|capture-arena-and-connection-denials|capture-native-(disconnect-cancellation|destructor-retirement)|display-event-(budget-and-readiness|disconnect-cleanup|failure-defers-owner-teardown)|cursor-native-(connection-denials-and-cancellation|destructor-retirement)|damage-native-(connection-denials-and-cancellation|destructor-retirement)|input-native-(connection-denials-and-cancellation|destructor-held-input-release)|pointer-xi2-(motion-coalescing|remote-echo-suppression|disconnect-cancellation|destructor-retirement|malformed-event-bounds)|desktop-resource-(owner-connection-denial|owner-lifecycle|event-routing|randr-rebuild|r4-read-boundary|capture-pixel-parity|randr-capture-generation|randr-stale-damage-isolation|capture-terminal-denial|pointer-capability-denials|pointer-event-routing|pointer-randr-rebuild|pointer-randr-stale-motion-isolation)|input-r3-admission-route-denials-and-revocation)$'

          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$r5_x11_selection")"
          printf '%s\n' "$selected_tests"

          readonly r5_expected_test_count=33
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:[[:space:]]+x11\./ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$r5_expected_test_count" ]]; then
            printf 'R5 native X11 registry mismatch: expected %s tests, found %s\n' \
              "$r5_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          grep -Fq 'x11.desktop-resource-capture-pixel-parity' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-randr-capture-generation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-randr-stale-damage-isolation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-pointer-randr-stale-motion-isolation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-capture-terminal-denial' <<< "$selected_tests"
          grep -Fq 'x11.capture-native-destructor-retirement' <<< "$selected_tests"

          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$r5_x11_selection" --output-on-failure

      - name: Run bounded coverage-guided MCS/CLIPRDR fuzzer
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          fuzz_selection='^fuzz\.mcs-cliprdr-bounded$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$fuzz_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'fuzz.mcs-cliprdr-bounded' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$fuzz_selection" --output-on-failure

      - name: Run bounded coverage-guided CredSSP fuzzer
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          fuzz_selection='^fuzz\.credssp-bounded$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$fuzz_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'fuzz.credssp-bounded' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$fuzz_selection" --output-on-failure

