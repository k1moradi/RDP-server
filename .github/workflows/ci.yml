          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$existing_cal_selection" --output-on-failure

          # R10 deployment policy is configuration-only and cannot mint R2/R3
          # authority. Still instrument both denial boundaries under ASan/UBSan.
          deployment_policy_selection='^runtime\.personal-desktop-(policy-immutable-denials|loopback-listener-denials)$'
          deployment_policy_tests="$(ctest --test-dir build --build-config Debug -N -R "$deployment_policy_selection")"
          printf '%s\n' "$deployment_policy_tests"
