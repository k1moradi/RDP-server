name: C++23 protocol CI and prerelease delivery

on:
  push:
    branches: [main]
    tags: ['protocol-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-workflow-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CI workflow structure and denial fixtures
        run: |
          set -euo pipefail
          python3 scripts/validate_ci_workflow.py \
            --workflow .github/workflows/ci.yml \
            --fixture-root tests/fixtures/ci_workflow_structure \
            --self-test

  protocol:
    needs: ci-workflow-structure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Record hosted macOS toolchain evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcode-select -p
          xcrun clang++ --version
          xcrun --sdk macosx --show-sdk-version
      - name: Locate or install Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('C:\Program Files\OpenSSL-Win64',
                    'C:\Program Files\OpenSSL',
                    'C:\Program Files (x86)\OpenSSL-Win32')
          $found = $dirs | Where-Object { Test-Path (Join-Path $_ 'include/openssl/ssl.h') } | Select-Object -First 1
          if (-not $found) {
            choco install openssl --no-progress -y
            $found = $dirs | Where-Object { Test-Path (Join-Path $_ 'include/openssl/ssl.h') } | Select-Object -First 1
          }
          if (-not $found) { throw 'OpenSSL headers are unavailable on the Windows runner' }
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$found"
      - name: Install Linux GSSAPI development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkrb5-dev libpam0g-dev libxcb1-dev libxcb-randr0-dev \
            pkg-config libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-damage0-dev libxcb-xtest0-dev \
            libxcb-xinput-dev xvfb xauth
      - name: Configure Debug protocol and tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi
          linux_gssapi_tests=OFF
          linux_pam_tests=OFF
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            linux_gssapi_tests=ON
            linux_pam_tests=ON
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DRDP_SERVER_TEST_LINUX_GSSAPI="$linux_gssapi_tests" \
            -DRDP_SERVER_TEST_LINUX_PAM="$linux_pam_tests"
      # R6 native-adapter validation must remain observable even when an
      # unrelated test target later fails the full repository compile.
      # This builds only the existing production-backed Windows fixture, then
      # the ordinary full build below still runs and remains authoritative.
      - name: Preflight Windows R6 native adapter tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Debug --target test_windows_desktop_geometry --parallel 2
          ctest --test-dir build --build-config Debug --timeout 20 -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
          cmake --build build --config Release --target test_windows_desktop_geometry --parallel 2
          ctest --test-dir build --build-config Release --timeout 20 -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
      - name: Compile Debug
        run: cmake --build build --config Debug --parallel 2
      - name: Preflight and run focused R7 macOS lifecycle tests (Debug)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          r7_focus='^(macos\.desktop-geometry-epoch-generation-fence-revocation|macos\.capture-stream-(geometry-generation-retirement|callback-retirement|consumer-cancellation|native-stop-single-ownership|backend-callback-reentry-retirement|start-retirement-after-completion|session-watch-frame-retirement|session-watch-consumer-race)|macos\.capture-r4-(bgra-layout-contract|pixel-lifetime-retirement|display-generation-denials)|macos\.cursor-(session-watch-revocation|topology-publication-revocation|geometry-generation-publication-denials)|macos\.input-controller-session-watch-revocation|macos\.desktop-session-(switch-away-back-revocation|mid-operation-epoch-change|watch-retirement-callback-race|watch-destructor-retirement))$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$r7_focus")"
          printf '%s\n' "$selected_tests"
          for required_test in \
            macos.desktop-geometry-epoch-generation-fence-revocation \
            macos.capture-stream-geometry-generation-retirement \
            macos.capture-stream-callback-retirement \
            macos.capture-stream-consumer-cancellation \
            macos.capture-stream-native-stop-single-ownership \
            macos.capture-stream-backend-callback-reentry-retirement \
            macos.capture-stream-start-retirement-after-completion \
            macos.capture-stream-session-watch-frame-retirement \
            macos.capture-stream-session-watch-consumer-race \
            macos.capture-r4-bgra-layout-contract \
            macos.capture-r4-pixel-lifetime-retirement \
            macos.capture-r4-display-generation-denials \
            macos.cursor-session-watch-revocation \
            macos.cursor-topology-publication-revocation \
            macos.cursor-geometry-generation-publication-denials \
            macos.input-controller-session-watch-revocation \
            macos.desktop-session-switch-away-back-revocation \
            macos.desktop-session-mid-operation-epoch-change \
            macos.desktop-session-watch-retirement-callback-race \
            macos.desktop-session-watch-destructor-retirement; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$r7_focus" --output-on-failure
      - name: Run Debug protocol and project-policy tests
        run: ctest --test-dir build --build-config Debug --timeout 60 --output-on-failure

      # Reconfigure the SAME build root for the release artifact. Never
      # create a parallel local or CI top-level build directory.
      - name: Reconfigure Release in same build root
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile Release
        run: cmake --build build --config Release --parallel 2
      - name: Preflight and run focused R7 macOS lifecycle tests (Release)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          r7_focus='^(macos\.desktop-geometry-epoch-generation-fence-revocation|macos\.capture-stream-(geometry-generation-retirement|callback-retirement|consumer-cancellation|native-stop-single-ownership|backend-callback-reentry-retirement|start-retirement-after-completion|session-watch-frame-retirement|session-watch-consumer-race)|macos\.capture-r4-(bgra-layout-contract|pixel-lifetime-retirement|display-generation-denials)|macos\.cursor-(session-watch-revocation|topology-publication-revocation|geometry-generation-publication-denials)|macos\.input-controller-session-watch-revocation|macos\.desktop-session-(switch-away-back-revocation|mid-operation-epoch-change|watch-retirement-callback-race|watch-destructor-retirement))$'
          selected_tests="$(ctest --test-dir build --build-config Release -N -R "$r7_focus")"
          printf '%s\n' "$selected_tests"
          for required_test in \
            macos.desktop-geometry-epoch-generation-fence-revocation \
            macos.capture-stream-geometry-generation-retirement \
            macos.capture-stream-callback-retirement \
            macos.capture-stream-consumer-cancellation \
            macos.capture-stream-native-stop-single-ownership \
            macos.capture-stream-backend-callback-reentry-retirement \
            macos.capture-stream-start-retirement-after-completion \
            macos.capture-stream-session-watch-frame-retirement \
            macos.capture-stream-session-watch-consumer-race \
            macos.capture-r4-bgra-layout-contract \
            macos.capture-r4-pixel-lifetime-retirement \
            macos.capture-r4-display-generation-denials \
            macos.cursor-session-watch-revocation \
            macos.cursor-topology-publication-revocation \
            macos.cursor-geometry-generation-publication-denials \
            macos.input-controller-session-watch-revocation \
            macos.desktop-session-switch-away-back-revocation \
            macos.desktop-session-mid-operation-epoch-change \
            macos.desktop-session-watch-retirement-callback-race \
            macos.desktop-session-watch-destructor-retirement; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          ctest --test-dir build --build-config Release --timeout 60 \
            -R "$r7_focus" --output-on-failure
      - name: Run Release protocol tests
        run: ctest --test-dir build --build-config Release --timeout 60 --output-on-failure
      - name: Stage installable protocol SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/build/stage"
      - name: Verify downstream CMake package, link and execution
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/consumer -B build/consumer \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build/stage" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer --config Release --parallel 2
          ctest --test-dir build/consumer --build-config Release --timeout 60 --output-on-failure
      - name: Package ZIP protocol SDK
        run: cmake --build build --config Release --target package
      - name: Generate reproducible artifact digest
        shell: bash
        run: |
          set -euo pipefail
          cd build
          cmake -E sha256sum rdp-server-protocol-*.zip > "SHA256SUMS-${{ matrix.os }}.txt"
      - name: Upload verified protocol SDK package
        uses: actions/upload-artifact@v4
        with:
          name: protocol-package-${{ matrix.os }}
          path: |
            build/rdp-server-protocol-*.zip
            build/SHA256SUMS-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 30

  # R6/R10 M1 compiler parity: exercise the ordinary Windows-native adapter
  # graph with the owner's required MSYS2 CLANG64 family. This is hosted
  # compiler/SDK evidence only; it does not replace the owner's persistent
  # ~/rdp-server/build receipt or authorize a live Windows desktop.
  r6-windows-clang23:
    needs: ci-workflow-structure
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-openssl
      - name: Verify Clang 23 and MinGW-w64 Windows API packages
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$MSYSTEM" = "CLANG64"
          clang++ --version
          clang++ --version | head -n 1 | grep -Eq 'clang version 23\.'
          cmake --version
          ninja --version
          pacman -Q             mingw-w64-clang-x86_64-clang             mingw-w64-clang-x86_64-headers             mingw-w64-clang-x86_64-crt             mingw-w64-clang-x86_64-libc++             mingw-w64-clang-x86_64-cmake             mingw-w64-clang-x86_64-openssl
      - name: Configure Debug with CLANG64
        id: r9_clang_debug_configure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_TESTING=ON             -DCMAKE_C_COMPILER=clang             -DCMAKE_CXX_COMPILER=clang++
          grep -E '^CMAKE_C_COMPILER:[^=]+=.*clang(\.exe)?$' build/CMakeCache.txt
          grep -E '^CMAKE_CXX_COMPILER:[^=]+=.*clang\+\+(\.exe)?$' build/CMakeCache.txt
      - name: Run Debug R6 native preflight
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Debug             --target test_windows_desktop_geometry --parallel 2
          selected_tests="$(ctest --test-dir build --build-config Debug -N             -R '^windows\.(geometry|capture|cursor|input)-')"
          printf '%s\n' "$selected_tests"
          for required_test in \
            windows.capture-session-change-duplication-owner-retirement \
            windows.capture-session-change-duplication-release-order \
            windows.capture-session-change-duplication-callback-retirement \
            windows.capture-session-change-duplication-prior-revocation \
            windows.capture-r4-bgra-layout-contract \
            windows.capture-r4-frame-lifetime-revocation \
            windows.capture-r4-monitor-replacement-denials; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          test "$(awk '/Test #[0-9]+: windows[.](geometry|capture|cursor|input)-/ { ++count } END { print count + 0 }' \
            <<< "$selected_tests")" -eq 58
          ctest --test-dir build --build-config Debug --timeout 20             -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
      - name: Build Debug CLANG64 test graph
        id: r9_clang_debug_build
        if: ${{ always() && steps.r9_clang_debug_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Debug --parallel 2
      - name: Run Debug R10 private-fixture security preflight
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          windows_fixture_selection='^runtime\.windows-private-fixture-'
          windows_fixture_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$windows_fixture_selection")"
          printf '%s\n' "$windows_fixture_tests"
          for required_test in \
            runtime.windows-private-fixture-dacl-creation \
            runtime.windows-private-fixture-broad-access-denials \
            runtime.windows-private-fixture-owner-consistency; do
            grep -Fq "$required_test" <<< "$windows_fixture_tests"
          done
          test "$(awk '/Test #[0-9]+: runtime[.]windows-private-fixture-/ { ++count } END { print count + 0 }' \
            <<< "$windows_fixture_tests")" -eq 3
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$windows_fixture_selection" --output-on-failure

          windows_security_regression='^(runtime\.licensing-context-secure-file-snapshots|runtime\.licensing-cli-valid-provisioning|runtime\.validates-configuration-windows-private-dacl|runtime\.validates-tls-files-private-regular|transport\.tcp-owned-runtime-tls-handshake)$'
          windows_security_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$windows_security_regression")"
          printf '%s\n' "$windows_security_tests"
          for required_test in \
            runtime.licensing-context-secure-file-snapshots \
            runtime.licensing-cli-valid-provisioning \
            runtime.validates-configuration-windows-private-dacl \
            runtime.validates-tls-files-private-regular \
            transport.tcp-owned-runtime-tls-handshake; do
            grep -Fq "$required_test" <<< "$windows_security_tests"
          done
          test "$(awk '/Test #[0-9]+: (runtime[.]licensing-context-secure-file-snapshots|runtime[.]licensing-cli-valid-provisioning|runtime[.]validates-configuration-windows-private-dacl|runtime[.]validates-tls-files-private-regular|transport[.]tcp-owned-runtime-tls-handshake)/ { ++count } END { print count + 0 }' \
            <<< "$windows_security_tests")" -eq 5
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$windows_security_regression" --output-on-failure
      - name: Run full Debug CTest under CLANG64
        if: ${{ always() && steps.r9_clang_debug_build.outcome == 'success' }}
        shell: msys2 {0}
        run: ctest --test-dir build --build-config Debug --timeout 60 --output-on-failure
      - name: Reconfigure same root for Release
        id: r9_clang_release_configure
        if: ${{ always() && steps.r9_clang_debug_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=ON             -DCMAKE_C_COMPILER=clang             -DCMAKE_CXX_COMPILER=clang++
      - name: Run Release R6 native preflight
        if: ${{ always() && steps.r9_clang_release_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Release             --target test_windows_desktop_geometry --parallel 2
          selected_tests="$(ctest --test-dir build --build-config Release -N             -R '^windows\.(geometry|capture|cursor|input)-')"
          printf '%s\n' "$selected_tests"
          for required_test in \
            windows.capture-session-change-duplication-owner-retirement \
            windows.capture-session-change-duplication-release-order \
            windows.capture-session-change-duplication-callback-retirement \
            windows.capture-session-change-duplication-prior-revocation \
            windows.capture-r4-bgra-layout-contract \
            windows.capture-r4-frame-lifetime-revocation \
            windows.capture-r4-monitor-replacement-denials; do
            grep -Fq "$required_test" <<< "$selected_tests"
          done
          test "$(awk '/Test #[0-9]+: windows[.](geometry|capture|cursor|input)-/ { ++count } END { print count + 0 }' \
            <<< "$selected_tests")" -eq 58
          ctest --test-dir build --build-config Release --timeout 20             -R '^windows\.(geometry|capture|cursor|input)-' --output-on-failure
      - name: Build Release CLANG64 test graph
        id: r9_clang_release_build
        if: ${{ always() && steps.r9_clang_release_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2
      - name: Run Release R10 private-fixture security preflight
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          windows_fixture_selection='^runtime\.windows-private-fixture-'
          windows_fixture_tests="$(ctest --test-dir build --build-config Release -N \
            -R "$windows_fixture_selection")"
          printf '%s\n' "$windows_fixture_tests"
          for required_test in \
            runtime.windows-private-fixture-dacl-creation \
            runtime.windows-private-fixture-broad-access-denials \
            runtime.windows-private-fixture-owner-consistency; do
            grep -Fq "$required_test" <<< "$windows_fixture_tests"
          done
          test "$(awk '/Test #[0-9]+: runtime[.]windows-private-fixture-/ { ++count } END { print count + 0 }' \
            <<< "$windows_fixture_tests")" -eq 3
          ctest --test-dir build --build-config Release --timeout 60 \
            -R "$windows_fixture_selection" --output-on-failure

          windows_security_regression='^(runtime\.licensing-context-secure-file-snapshots|runtime\.licensing-cli-valid-provisioning|runtime\.validates-configuration-windows-private-dacl|runtime\.validates-tls-files-private-regular|transport\.tcp-owned-runtime-tls-handshake)$'
          windows_security_tests="$(ctest --test-dir build --build-config Release -N \
            -R "$windows_security_regression")"
          printf '%s\n' "$windows_security_tests"
          for required_test in \
            runtime.licensing-context-secure-file-snapshots \
            runtime.licensing-cli-valid-provisioning \
            runtime.validates-configuration-windows-private-dacl \
            runtime.validates-tls-files-private-regular \
            transport.tcp-owned-runtime-tls-handshake; do
            grep -Fq "$required_test" <<< "$windows_security_tests"
          done
          test "$(awk '/Test #[0-9]+: (runtime[.]licensing-context-secure-file-snapshots|runtime[.]licensing-cli-valid-provisioning|runtime[.]validates-configuration-windows-private-dacl|runtime[.]validates-tls-files-private-regular|transport[.]tcp-owned-runtime-tls-handshake)/ { ++count } END { print count + 0 }' \
            <<< "$windows_security_tests")" -eq 5
          ctest --test-dir build --build-config Release --timeout 60 \
            -R "$windows_security_regression" --output-on-failure
      - name: Run full Release CTest under CLANG64
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: ctest --test-dir build --build-config Release --timeout 60 --output-on-failure
      - name: Reconfigure same root for R6 Windows sanitizers
        id: r6_windows_sanitizer_configure
        if: ${{ always() && steps.r9_clang_release_build.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build R6 Windows native sanitizer fixture
        id: r6_windows_sanitizer_build
        if: ${{ always() && steps.r6_windows_sanitizer_configure.outcome == 'success' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --config Debug \
            --target test_windows_desktop_geometry --parallel 2
      - name: Run R6 Windows native lifetime CTests with sanitizers
        if: ${{ always() && steps.r6_windows_sanitizer_build.outcome == 'success' }}
        shell: msys2 {0}
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          r6_sanitizer_selection='^windows\.(geometry|capture|cursor|input)-'
          r6_sanitizer_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$r6_sanitizer_selection")"
          printf '%s\n' "$r6_sanitizer_tests"
          for required_test in \
            windows.capture-session-change-duplication-owner-retirement \
            windows.capture-session-change-duplication-release-order \
            windows.capture-session-change-duplication-callback-retirement \
            windows.capture-session-change-duplication-prior-revocation \
            windows.capture-r4-bgra-layout-contract \
            windows.capture-r4-frame-lifetime-revocation \
            windows.capture-r4-monitor-replacement-denials; do
            grep -Fq "$required_test" <<< "$r6_sanitizer_tests"
          done
          test "$(awk '/Test #[0-9]+: windows[.](geometry|capture|cursor|input)-/ { ++count } END { print count + 0 }' \
            <<< "$r6_sanitizer_tests")" -eq 58
          ctest --test-dir build --build-config Debug --timeout 20 \
            -R "$r6_sanitizer_selection" --output-on-failure

  # R9: one bounded sanitizer job across existing first-party CLIPRDR/X11,
  # MCS/CredSSP, native R2->R3 admission/revocation and R3 licensing contracts.
  r9-security-protocol-sanitizers:
    needs: ci-workflow-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Clang sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v clang++
          clang --version
          clang++ --version
      - name: Install credential-free Linux GSSAPI build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libkrb5-dev libpam0g-dev libsystemd-dev pkg-config \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-damage0-dev libxcb-xtest0-dev \
            libxcb-xinput-dev xvfb xauth
      - name: Configure first-party protocol tests with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DRDP_SERVER_TEST_LINUX_GSSAPI=ON \
            -DRDP_SERVER_TEST_LINUX_PAM=ON \
            -DRDP_SERVER_TEST_REAL_KERBEROS=OFF \
            -DRDP_SERVER_BUILD_FUZZERS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
