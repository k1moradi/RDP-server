          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$delegated_account_selection" --output-on-failure
      - name: Run R10 licensing-authority CTests with sanitizers
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          authority_selection='^runtime\.licensing-authority-'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$authority_selection")"
          printf '%s\n' "$selected_tests"
          readonly authority_expected_test_count=7
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$authority_expected_test_count" ]]; then
            printf 'R9 M2 authority registry mismatch: expected %s tests, found %s\n' \
              "$authority_expected_test_count" "$selected_test_count" >&2
