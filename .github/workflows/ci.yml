      - name: Run bounded native R2/R3 GSSAPI CTests with sanitizers
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # MIT krb5 1.20.1 and 1.21.3 both leak an unreachable internal
          # principal copy when gss_acquire_cred_from fails with no output
          # credential. Keep the suppression scoped to these GSS tests only.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/r9-mit-krb5-lsan.supp:print_suppressions=1
        run: |
          set -euo pipefail
          native_gss_selection='^security\.gssapi-(configuration-rejections|framed-handoff|console-provenance-before-os-read|native-os-admission-capability-denials|native-admission-nla-transport-provenance-denials|credssp-delegated-account-origin-denials|initial-nla-owner-fence|credssp-transport-provenance-fence|binding-delivery-transport-fence|credssp-authinfo-terminal-denials|credssp-transport-cancellation-fence|completed-frame-transport-cancellation-fence|mcs-admission-contract|protected-transition-generation-fence|connect-response-write-contract|connect-response-completion-reauthorization|erect-domain-contract|attach-user-contract|channel-join-contract|channel-join-terminal-replay-fence|joined-clipboard-role-contract|client-info-route-contract|server-license-request-write-contract|client-licensing-route-contract|server-platform-challenge-write-contract|client-platform-challenge-response-route-contract|attach-user-terminal-replay-fence|protected-transition-terminal-replay-fence|native-change-revocation|mcs-disconnect-revocation-fence)$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N -R "$native_gss_selection")"
          printf '%s\n' "$selected_tests"
          readonly native_gss_expected_test_count=30
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$native_gss_expected_test_count" ]]; then
            printf 'R9 M2 native GSS registry mismatch: expected %s tests, found %s\n' \
              "$native_gss_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          grep -Fq 'security.gssapi-credssp-delegated-account-origin-denials' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 --verbose \
            -R "$native_gss_selection" --output-on-failure

      - name: Run R2 Linux PAM verifier denials with sanitizers
