  # R9 P0 candidate nomination. The protocol matrix directly executes
  # Agent 6's Microsoft Windows SSPI Type-2 oracle on Windows.
  r9-credssp-owner-candidate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.r9_credssp_owner_candidate }}
    needs:
      - ci-workflow-structure
      - protocol
      - r6-windows-clang23
      - r9-security-protocol-sanitizers
      - r9-owner-gui-credential-parity
      - r9-gui-round2-acceptance
      - r9-portable-gui-bootstrap-acceptance
      - documentation-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact-SHA Microsoft interop result matrix
        uses: actions/download-artifact@v4
        with:
          name: r9-microsoft-interop-${{ github.sha }}
          path: build/r9-microsoft-interop
      - name: Download exact-SHA Linux owner acceptance package
        uses: actions/download-artifact@v4
        with:
          name: rdp-server-owner-acceptance-linux
          path: build/r9-owner-package
      - name: Require exact-SHA CredSSP owner-candidate prerequisites
        env:
          STRUCTURE_RESULT: ${{ needs.ci-workflow-structure.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          WINDOWS_CLANG_RESULT: ${{ needs.r6-windows-clang23.result }}
          R9_RESULT: ${{ needs.r9-security-protocol-sanitizers.result }}
          GUI_PARITY_RESULT: ${{ needs.r9-owner-gui-credential-parity.result }}
          GUI_ROUND2_RESULT: ${{ needs.r9-gui-round2-acceptance.result }}
          OWNER_PACKAGE_RESULT: ${{ needs.r9-portable-gui-bootstrap-acceptance.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-policy.result }}
        shell: bash
        run: |
          set -euo pipefail
          matrix_file='build/r9-microsoft-interop/r9-microsoft-interop-results.txt'
          test -f "$matrix_file"
          cat "$matrix_file"
          grep -Fxq "interop-matrix-begin=PARTIAL source-sha=$GITHUB_SHA workflow-run=$GITHUB_RUN_ID" "$matrix_file"
          grep -Fxq "interop-matrix-final=COMPLETE_PASS source-sha=$GITHUB_SHA" "$matrix_file"
          grep -Fxq 'credssp-full-production-authinfo-failure=none' "$matrix_file"
          grep -Fxq 'credssp-full-production-authinfo-empty-fields=none' "$matrix_file"
          grep -Fxq 'credssp-full-delegation-requested=yes' "$matrix_file"
          grep -Eq '^credssp-full-delegation-returned=(yes|no)$' "$matrix_file"
          full_exchange_receipt="$(grep '^credssp-full-exchange-microsoft-credssp-full-exchange ' "$matrix_file")"
          test -n "$full_exchange_receipt"
          grep -Fq 'status=PASS' <<< "$full_exchange_receipt"
          grep -Fq 'credentials-verified=yes' <<< "$full_exchange_receipt"
          grep -Fq 'production-authinfo-failure=none' <<< "$full_exchange_receipt"
          grep -Fq 'production-authinfo-empty-fields=none' <<< "$full_exchange_receipt"
          grep -Fq 'delegation-requested=yes' <<< "$full_exchange_receipt"
          grep -Eq 'delegation-returned=(yes|no)' <<< "$full_exchange_receipt"
          grep -Fxq 'ntlm-fixed-name=PASS test=security.windows-sspi-production-type2-interop' "$matrix_file"
          grep -Fxq 'ntlm-ip-target=PASS test=security.windows-sspi-production-type2-physical-ip-target' "$matrix_file"
          grep -Fxq 'ntlm-oem-omission=PASS test=security.windows-sspi-production-type2-oem-omission-differential' "$matrix_file"
          oem_profile="$(grep '^ntlm-oem-microsoft-sspi-oem-omission-differential ' "$matrix_file")"
          test -n "$oem_profile"
          grep -Fq 'client-offered-oem=yes' <<< "$oem_profile"
          grep -Fq 'only-oem-response-bit-removed=yes' <<< "$oem_profile"
          grep -Fq 'version-omitted=yes' <<< "$oem_profile"
          grep -Fq 'target-name-unchanged=yes' <<< "$oem_profile"
          grep -Fq 'target-info-unchanged=yes' <<< "$oem_profile"
          grep -Fq 'timestamp-unchanged=yes' <<< "$oem_profile"
          grep -Fq 'timestamp-age-recorded=yes' <<< "$oem_profile"
          grep -Eq 'timestamp-age-ms=[0-9]+' <<< "$oem_profile"
          grep -Fq 'type3=yes' <<< "$oem_profile"
          grep -Fq 'qualified=yes' <<< "$oem_profile"
          grep -Fq 'physical-type1-flags=0xe2088235' <<< "$oem_profile"
          grep -Fq 'physical-type2-flags=0xe08a8235' <<< "$oem_profile"
          oem_differential="$(grep '^physical-flag-oem-differential=TYPED ' "$matrix_file")"
          test -n "$oem_differential"
          grep -Fq 'microsoft-oem-omission=PASS' <<< "$oem_differential"
          grep -Fq 'oem-response-bit-difference-ruled-out=yes' <<< "$oem_differential"

          physical_type1_profile="$(grep '^physical-owner-type1-profile=OBSERVED ' "$matrix_file")"
          test -n "$physical_type1_profile"
          grep -Fq 'bytes=40' <<< "$physical_type1_profile"
          grep -Fq 'flags=0xe2088235' <<< "$physical_type1_profile"
          grep -Fq 'version=6.0.6001/0x0f' <<< "$physical_type1_profile"
          grep -Fq 'domain-supplied=no' <<< "$physical_type1_profile"
          grep -Fq 'workstation-supplied=no' <<< "$physical_type1_profile"

          tls_differential="$(grep '^tls-version-differential=TYPED ' "$matrix_file")"
          test -n "$tls_differential"
          grep -Fq 'physical-tls=TLSv1.3' <<< "$tls_differential"
          grep -Fq 'production-tls-change-authorized=no' <<< "$tls_differential"
          grep -Fq 'tls13-external-oracle=PASS' <<< "$tls_differential"
          grep -Fq 'tls12-only-physical-ab=NOT_JUSTIFIED' <<< "$tls_differential"
          next_physical_tls_mode=production-policy

          grep -Fxq 'credssp-credential-semantics=PASS test=security.windows-credssp-credential-semantic-differential' "$matrix_file"
          for credential_state in correct wrong-password empty-password unavailable-no-spnego; do
            credential_line="$(grep "^credential-semantic-microsoft-credssp-credential-semantics credential-state=$credential_state " "$matrix_file")"
            test -n "$credential_line"
            grep -Eq 'outcome=(TYPE3_EMITTED|FAILED_BEFORE_TYPE1|POST_TYPE2_NO_TYPE3|OTHER_TYPED_TERMINAL)' <<< "$credential_line"
            grep -Eq 'acquire-status=[A-Z0-9_]+ acquire-code=0x[0-9a-fA-F]{8}' <<< "$credential_line"
            grep -Eq 'first-isc-called=(yes|no) first-isc-status=[A-Z0-9_]+' <<< "$credential_line"
            grep -Eq 'first-tsrequest=(yes|no) type1=(yes|no) type2-consumed=(yes|no) next-client-output=(yes|no) type3=(yes|no)' <<< "$credential_line"
            grep -Eq 'terminal-status=[A-Z0-9_]+ terminal-code=0x[0-9a-fA-F]{8}' <<< "$credential_line"
            grep -Eq 'elapsed-us=[0-9]+' <<< "$credential_line"
          done
          correct_credential="$(grep '^credential-semantic-microsoft-credssp-credential-semantics credential-state=correct ' "$matrix_file")"
          grep -Fq 'outcome=TYPE3_EMITTED' <<< "$correct_credential"
          grep -Fq 'first-tsrequest=yes type1=yes type2-consumed=yes next-client-output=yes type3=yes' <<< "$correct_credential"
          default_credential="$(grep '^credential-semantic-microsoft-credssp-credential-semantics credential-state=default-credential ' "$matrix_file")"
          grep -Fq 'outcome=NOT_RUN_POLICY' <<< "$default_credential"
          grep -Fq 'hosted-runner-credentials-used=no' <<< "$default_credential"
          semantic_summary="$(grep '^credential-semantic-summary-microsoft-credssp-credential-semantics-summary ' "$matrix_file")"
          grep -Fq 'status=PASS correct-control=TYPE3' <<< "$semantic_summary"
          grep -Eq 'physical-sequence-match=(yes|no)' <<< "$semantic_summary"
          grep -Eq 'leading-comparison=[^ ]+' <<< "$semantic_summary"
          grep -Eq 'unavailable-no-spnego-match=(yes|no|inconclusive)' <<< "$semantic_summary"
          grep -Eq 'all-noncontrol-type3-or-pretype1=(yes|no)' <<< "$semantic_summary"
          grep -Fq 'default-credential=NOT_RUN_POLICY' <<< "$semantic_summary"
          grep -Fq 'production-type2-change-authorized=no' <<< "$semantic_summary"

          grep -Fxq 'credssp-type2-required-av-negative-controls=PASS test=security.windows-credssp-type2-required-av-negative-controls' "$matrix_file"
          for experiment in missing-msv-av-nb-computer-name missing-msv-av-nb-domain-name; do
            negative_line="$(grep "^type2-negative-microsoft-credssp-type2-negative-control experiment=$experiment " "$matrix_file")"
            test -n "$negative_line"
            grep -Fq 'challenge-committed=yes' <<< "$negative_line"
            grep -Fq 'type2-consumed=yes' <<< "$negative_line"
            grep -Fq 'type3=no' <<< "$negative_line"
            grep -Fq 'oracle-detected=yes' <<< "$negative_line"
          done
          negative_summary="$(grep '^type2-negative-summary-microsoft-credssp-type2-negative-controls ' "$matrix_file")"
          grep -Fq 'control=TYPE3' <<< "$negative_summary"
          grep -Fq 'invalid-controls=DETECTED' <<< "$negative_summary"
          grep -Fq 'status=PASS' <<< "$negative_summary"
          grep -Fq 'process-isolation=per-challenge' <<< "$negative_summary"
          grep -Fq 'production-type2-change-authorized=no' <<< "$negative_summary"

          grep -Fxq 'credssp-fixed-name-control=PASS test=security.windows-credssp-production-control-target-next-token' "$matrix_file"
          grep -Fxq 'credssp-ip-spn-target=PASS test=security.windows-credssp-production-physical-ip-target-next-token' "$matrix_file"
          grep -Fxq 'credssp-bare-ip-target=PASS test=security.windows-credssp-production-bare-ip-target-next-token' "$matrix_file"
          grep -Fxq 'credssp-target-differential=TYPED' "$matrix_file"
          grep -Fxq 'server-production-tls13=PASS test=runtime.generated-tls-context-negotiates-tls13' "$matrix_file"
          grep -Fxq 'credssp-tls-system-default=PASS test=security.windows-credssp-tls-system-default' "$matrix_file"
          grep -Fxq 'credssp-tls12-only-server=PASS test=security.windows-credssp-tls12-only-server' "$matrix_file"
          grep -Fxq 'credssp-tls13-only-server=PASS test=security.windows-credssp-tls13-only-server' "$matrix_file"
          tls_default_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=system-default ' "$matrix_file")"
          tls12_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=tls12-only ' "$matrix_file")"
          tls13_receipt="$(grep '^microsoft-credssp-tls-version-matrix profile=tls13-only ' "$matrix_file")"
          grep -Fq 'schannel=SCHANNEL_CRED status=PASS' <<< "$tls_default_receipt"
          grep -Fq 'first-tsrequest=yes type1=yes type2-committed=yes next-tsrequest=yes type3=yes' <<< "$tls_default_receipt"
          grep -Fq 'schannel=SCHANNEL_CRED status=PASS negotiated-tls=TLS1.2' <<< "$tls12_receipt"
          grep -Fq 'first-tsrequest=yes type1=yes type2-committed=yes next-tsrequest=yes type3=yes' <<< "$tls12_receipt"
          grep -Fq 'schannel=SCH_CREDENTIALS-system-defaults' <<< "$tls13_receipt"
          grep -Fq 'status=PASS negotiated-tls=TLS1.3' <<< "$tls13_receipt"
          grep -Fq 'physical-reference-tls=TLS1.3 physical-reference-cipher=TLS_AES_256_GCM_SHA384' <<< "$tls13_receipt"
          grep -Fq 'first-tsrequest=yes type1=yes type2-committed=yes next-tsrequest=yes type3=yes' <<< "$tls13_receipt"
          type1_profile="$(grep '^credssp-fixed-name-microsoft-credssp-client-profile-differential target=TERMSRV/RDP-SERVER ' "$matrix_file")"
          test -n "$type1_profile"
          interop_profile="$(grep '^interop-type1-type2-profile=microsoft-credssp-client-profile-differential target=TERMSRV/RDP-SERVER ' "$matrix_file")"
          test -n "$interop_profile"
          grep -Eq 'hosted-type1-flags=0x[0-9a-fA-F]{8}' <<< "$interop_profile"
          grep -Eq 'hosted-type2-flags=0x[0-9a-fA-F]{8}' <<< "$interop_profile"
          grep -Eq 'hosted-type1-bytes=[1-9][0-9]*' <<< "$interop_profile"
          grep -Eq 'hosted-type2-bytes=[1-9][0-9]*' <<< "$interop_profile"
          grep -Eq 'hosted-target-name-code-units=[1-9][0-9]*' <<< "$interop_profile"
          grep -Eq 'hosted-target-info-bytes=[1-9][0-9]*' <<< "$interop_profile"
          grep -Fq 'physical-type1-flags=0xe2088235' <<< "$type1_profile"
          grep -Fq 'physical-type1-bytes=40' <<< "$type1_profile"
          grep -Fq 'hosted-type1-flags=0x' <<< "$type1_profile"
          grep -Eq 'hosted-type1-bytes=[1-9][0-9]*' <<< "$type1_profile"
          grep -Fq 'type1-exact-equality-required=no' <<< "$type1_profile"
          grep -Eq 'hosted-version-structure=(valid|absent)' <<< "$type1_profile"
          for result in \
            "$STRUCTURE_RESULT" \
            "$PROTOCOL_RESULT" \
            "$WINDOWS_CLANG_RESULT" \
            "$R9_RESULT" \
            "$GUI_PARITY_RESULT" \
            "$GUI_ROUND2_RESULT" \
            "$OWNER_PACKAGE_RESULT" \
            "$DOCUMENTATION_RESULT"; do
            test "$result" = success
          done
          grep -Fq 'security.windows-sspi-production-type2-interop' \
            tests/CMakeLists.txt
          grep -Fq 'security.windows-sspi-production-type2-physical-ip-target' \
            tests/CMakeLists.txt
          grep -Fq 'security.windows-sspi-production-type2-oem-omission-differential' \
            tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-harness-stream-buffer-retention' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-harness-multi-turn-round-progression' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-tls-system-default' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-tls12-only-server' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-tls13-only-server' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-modern-schannel-system-defaults-full-boundary-probe' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-credential-semantic-differential' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-type2-required-av-negative-controls' tests/CMakeLists.txt
          grep -Fq 'run_windows_credssp_type2_negative_controls.cmake' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-production-control-target-next-token' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-production-physical-ip-target-next-token' tests/CMakeLists.txt
          grep -Fq 'security.windows-credssp-production-bare-ip-target-next-token' tests/CMakeLists.txt
          grep -Fq 'runtime.start-stop-start-and-tls-interop' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-connection-target-identity-retained-across-peer-retry' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-type2-peer-eof-pre-admission-diagnostics' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-type2-peer-eof-timing-diagnostics' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-client-data-timeline-diagnostics' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-silence' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-partial-tls-record' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-non-type3-tsrequest' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-tls-close-notify' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-orderly-fin' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-direct-ntlm-post-type2-immediate-retry' tests/CMakeLists.txt
          grep -Fq 'post-type2-client-tls-bytes=%llu' src/server/runtime/linux_runtime_host_control.cpp
          grep -Fq 'runtime.generated-tls-identity-owner-ipv4-san-der' tests/CMakeLists.txt
          grep -Fq 'runtime.generated-tls-context-negotiates-tls13' tests/CMakeLists.txt
          grep -Fq 'runtime.rejects-tls-credentials-client-only-certificate' tests/CMakeLists.txt
          grep -Fq 'runtime.rejects-tls-credentials-expired-certificate' tests/CMakeLists.txt
          grep -Fq 'runtime.rejects-tls-credentials-not-yet-valid-certificate' tests/CMakeLists.txt
          grep -Fq 'security.windows-generated-tls-certificate-policy-profiles' tests/CMakeLists.txt
          grep -Fq 'security.macos-generated-tls-certificate-policy-profiles' tests/CMakeLists.txt
          grep -Fq 'runtime.linux-connection-tls-acceptance-diagnostics' tests/CMakeLists.txt
          grep -Fq 'tls-version=%s tls-cipher-id=0x%04x tls-cipher=%.*s' \
            src/server/runtime/linux_runtime_host_control.cpp
          grep -Fq 'Primary Microsoft Windows NTLM and CredSSP target differential' \
            .github/workflows/ci.yml
          grep -Fq 'security.credssp-direct-ntlm-physical-type1-tsrequest-conformance' \
            tests/CMakeLists.txt
          grep -Fq 'native-admission-reason-taxonomy-and-positive-fixture' \
            .github/workflows/ci.yml
          grep -Fq 'admission-denial-exposes-bounded-reason-and-retries' \
            .github/workflows/ci.yml
          grep -Fq 'project[.]ctest-durable-label-taxonomy' \
            .github/workflows/ci.yml
          grep -Fq 'gui.offscreen-local-username-default-keeps-session-password-empty' \
            .github/workflows/ci.yml
          grep -Fq 'macos.windows-app-owner-evidence-readonly-manifest' tests/CMakeLists.txt
          test -f docs/MACOS_WINDOWS_APP_OWNER_EVIDENCE.md
          printf 'R9 CREDSSP OWNER CANDIDATE PASS: %s\n' "$GITHUB_SHA"
          printf 'NEXT PHYSICAL TLS MODE: %s\n' "$next_physical_tls_mode"
          printf 'NEXT OWNER RECEIPT MUST BEGIN, BEFORE BUILD/TEST, WITH:\n'
          printf 'git rev-parse HEAD\n'
          printf 'expected exact SHA: %s\n' "$GITHUB_SHA"
          printf '%s\n' \
            'NEXT PHYSICAL EVIDENCE BUNDLE REQUIRED:' \
            '1. exact SHA from the initial git rev-parse HEAD before build/test' \
            '2. full CTest result' \
            '3. complete Linux server terminal block from the same attempt' \
            '4. Windows App version/build from the same attempt' \
            '5. destination string exactly as entered in Windows App' \
            '6. explicit Saved credential selected yes/no' \
            '7. credential username; never record the password' \
            '8. password matched to the server Session Password yes/no; never record the password' \
            '9. whether Windows App showed a certificate warning' \
            '10. whether that certificate warning was accepted' \
            '11. same-attempt Windows App Core/UI logs' \
            '12. exact user-visible Windows App error' \
            '13. offset-aware attempt timestamp' \
            '14. post-Type-2 scalars: encrypted/plaintext bytes, complete/partial TSRequests, TLS alerts/close_notify, TCP FIN/reset, first-byte and EOF timings' \
            'TLS mode is fixed by this gate to production-policy.'
      - name: Create actionable exact-SHA owner acceptance manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t owner_archives < <(find build/r9-owner-package -maxdepth 1 -type f \
            -name 'rdp-server-owner-acceptance-*.zip' | sort)
          test "${#owner_archives[@]}" -eq 1
          checksum_file='build/r9-owner-package/rdp-server-owner-acceptance-SHA256SUMS.txt'
          test -f "$checksum_file"
          expected_package_sha="$(awk 'NR == 1 { print $1 }' "$checksum_file")"
          test "$expected_package_sha" != ""
          actual_package_sha="$(sha256sum "${owner_archives[0]}" | awk '{ print $1 }')"
          test "$actual_package_sha" = "$expected_package_sha"
          cat > build/r9-owner-acceptance-manifest.txt <<EOF
          rdp-server-r9-owner-acceptance-manifest-v1
          candidate-gate=PASS
          source-sha=$GITHUB_SHA
          workflow-run-id=$GITHUB_RUN_ID
          workflow-url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          workflow-event=$GITHUB_EVENT_NAME
          manual-input-r9_credssp_owner_candidate=true
          tls-mode=production-policy
          interop-artifact=r9-microsoft-interop-$GITHUB_SHA
          interop-matrix=COMPLETE_PASS
          owner-package-artifact=rdp-server-owner-acceptance-linux
          owner-package-sha256=$actual_package_sha

          OWNER BUILD/TEST COMMAND:
          cd ~/rdp-server && git switch main && git pull --ff-only origin main && git rev-parse HEAD && cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON && cmake --build build --config Debug --parallel 2 && ctest --test-dir build -C Debug --output-on-failure

          FULL CTEST RECEIPT REQUIRED:
          exact source SHA; native OS/toolchain identity; configure/build result; complete CTest total/pass/fail/skipped/not-run counts; first failing test if any. Any mismatch, crash, skip of a required gate or nonzero failure count invalidates the candidate.

          SERVER LOG REQUIRED FROM THE SAME PHYSICAL ATTEMPT:
          complete bounded Linux terminal record including connection ID/timestamp; TLS version/cipher; Type-1 observation; production Type-2 queue/commit; post-Type-2 encrypted/plaintext byte and TSRequest counters; TLS alert/close_notify; TCP FIN/reset; Type-3/pubKeyAuth/authInfo/CredentialsVerified reachability. Never record passwords, NTLM response bytes, keys or delegated credentials.

          CLIENT-SIDE EVIDENCE REQUIRED FROM THE SAME PHYSICAL ATTEMPT:
          Windows App version/build; exact destination string; explicit Saved credential selected yes/no; credential username; password matched to server Session Password yes/no without recording the password; certificate warning shown yes/no; warning accepted yes/no; supported same-attempt Windows App Core/UI logs; exact user-visible error/result; offset-aware attempt timestamp.

          Candidate-gate PASS qualifies the owner-authorized physical test. It is not authentication, native Admission, Share or desktop acceptance.
          EOF
          grep -Fxq "source-sha=$GITHUB_SHA" build/r9-owner-acceptance-manifest.txt
          grep -Fxq 'candidate-gate=PASS' build/r9-owner-acceptance-manifest.txt
      - name: Upload actionable exact-SHA owner acceptance manifest
        uses: actions/upload-artifact@v4
        with:
          name: r9-owner-acceptance-manifest-${{ github.sha }}
          path: |
            build/r9-owner-acceptance-manifest.txt
            build/r9-microsoft-interop/r9-microsoft-interop-results.txt
            build/r9-owner-package/rdp-server-owner-acceptance-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # R9 GUI Round 2 qualification uses ordinary exact-SHA hosted evidence.
  # CLEAN Windows is intentionally a separate release-evidence track.
  r9-gui-round2-acceptance:
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      - r5-linux-gui-zip
      - r7-macos-portable-gui
      - r6-windows-clang23
      - documentation-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require GUI Round 2 exact-SHA producers
        env:
          LINUX_GUI_RESULT: ${{ needs.r5-linux-gui-zip.result }}
          MACOS_GUI_RESULT: ${{ needs.r7-macos-portable-gui.result }}
          WINDOWS_GUI_RESULT: ${{ needs.r6-windows-clang23.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-policy.result }}
        run: |
          set -euo pipefail
          for result in \
            "$LINUX_GUI_RESULT" \
            "$MACOS_GUI_RESULT" \
            "$WINDOWS_GUI_RESULT" \
            "$DOCUMENTATION_RESULT"; do
            test "$result" = success
          done
          printf 'GUI ROUND 2 PASS: %s\n' "$GITHUB_SHA"

  # Only trusted main may execute on the owner's clean standard-user VM.
  # A missing interactive clean Windows VM is a hard release block.
  # R9 ordinary hosted syntax gate; it must never wait on the clean VM.
  r9-windows-powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse real clean-Windows acceptance script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $PWD 'scripts\clean_windows_portable_gui.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) {
              $details = @($parseErrors | ForEach-Object {
                '{0}:{1}-{2}:{3}: {4} [extent={5}]' -f
                  $_.Extent.StartLineNumber,
                  $_.Extent.StartColumnNumber,
                  $_.Extent.EndLineNumber,
                  $_.Extent.EndColumnNumber,
                  $_.Message,
                  $_.Extent.Text
              }) -join [Environment]::NewLine
              throw ('clean_windows_portable_gui.ps1 parser regression:' + [Environment]::NewLine + $details)
          }

  r9-clean-windows-portable-gui:
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [ci-workflow-structure, r6-windows-clang23, r9-windows-powershell-parser]
    runs-on: [self-hosted, Windows, X64, r9-clean-windows-gui]
    steps:
      - name: Require clean-Windows producer and policy checks
        shell: powershell
        env:
          STRUCTURE_RESULT: ${{ needs.ci-workflow-structure.result }}
          PRODUCER_RESULT: ${{ needs.r6-windows-clang23.result }}
          PARSER_RESULT: ${{ needs.r9-windows-powershell-parser.result }}
        run: |
          if ($env:STRUCTURE_RESULT -ne 'success' -or
              $env:PRODUCER_RESULT -ne 'success' -or
              $env:PARSER_RESULT -ne 'success') {
            throw 'Windows GUI release prerequisites failed'
          }
      - uses: actions/checkout@v4
      - name: Download exact staged Windows PORTABLE-GUI candidate
        uses: actions/download-artifact@v4
        with:
          name: r9-windows-unverified-${{ github.sha }}
          path: build/clean-windows-input
      - name: Validate unmodified ZIP and launch in ordinary Windows desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath 'build/clean-windows-input' -File -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one exact Windows ZIP' }
          & ./scripts/clean_windows_portable_gui.ps1 -Archive $archives[0].FullName -ExactGitSha '${{ github.sha }}' -Receipt 'build/clean-windows-receipt.json'
          if (!$?) { throw 'Clean Windows GUI launch gate failed' }
      - name: Upload clean-Windows exact-SHA acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: r9-clean-windows-receipt-${{ github.sha }}
          path: |
            build/clean-windows-receipt.json
            build/clean-windows-receipt.json.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified public Windows x86_64 PORTABLE-GUI ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rdp-server-portable-gui-windows-x86_64
          path: |
            build/clean-windows-input/rdp-server-portable-gui-*-windows-x86_64-*.zip
            build/clean-windows-input/rdp-server-portable-gui-*-windows-x86_64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # R7/R9 native arm64 PORTABLE-GUI closure. Packages the real Qt .app but
  # never grants R2 admission, starts a listener, or requests TCC.
  r7-macos-portable-gui:
    needs: ci-workflow-structure
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS Qt/OpenSSL packaging dependencies
        run: |
          set -euo pipefail
          brew install openssl@3 qt
      - name: Verify arm64 runner and Qt deployment tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          qt_prefix="$(brew --prefix qt)"
          test -x "$qt_prefix/bin/macdeployqt"
          "$qt_prefix/bin/qmake" -query QT_VERSION
          xcrun clang++ --version
          otool --version
      - name: Configure and build real R7 Qt app bundle
        shell: bash
        run: |
          set -euo pipefail
          qt_prefix="$(brew --prefix qt)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=ON \
            -DRDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI=OFF \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            "-DCMAKE_PREFIX_PATH=$qt_prefix"
          grep -Fx 'RDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI:BOOL=OFF' build/CMakeCache.txt
          cmake --build build --config Release \
            --target rdp-server-desktop --parallel 2
          test -x build/rdp-server-desktop.app/Contents/MacOS/rdp-server-desktop
          test -f build/rdp-server-desktop.app/Contents/Info.plist
      - name: Run macOS portable GUI integrity and framework-alias CTests
        shell: bash
        run: |
          set -euo pipefail
          selector='^(packaging[.]macos-portable-gui-(app-integrity-denials|framework-alias-integrity-denials)|packaging[.]portable-gui-macos-framework-link-verifier-denials)$'
          inventory="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$inventory"
          for required in \
            packaging.macos-portable-gui-app-integrity-denials \
            packaging.macos-portable-gui-framework-alias-integrity-denials \
            packaging.portable-gui-macos-framework-link-verifier-denials; do
            grep -Fq "$required" <<< "$inventory"
          done
          ctest --test-dir build -C Release -R "$selector" --output-on-failure
      - name: Build and run R7 Qt GUI offscreen behavior CTests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target test_desktop_gui_offline --parallel 2
          ctest --test-dir build -C Release -N -R '^gui[.]offscreen-'
          ctest --test-dir build -C Release --timeout 30 \
            -R '^gui[.]offscreen-' --output-on-failure
      # Normal extracted-package startup must not request Screen Recording or
      # Accessibility. Exercise the real macOS RuntimeHostControl pre-listener
      # service path at this exact packaging SHA before LaunchServices opens it.
      - name: Pin macOS pre-listener no-TCC-prompt runtime CTest
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target test_macos_runtime_host_control --parallel 2
          selector='^runtime[.]macos-host-control-no-prompt-on-app-launch$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': runtime.macos-host-control-no-prompt-on-app-launch' <<< "$selected_tests"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")" -eq 1
          ctest --test-dir build -C Release --timeout 30 -R "$selector" --output-on-failure

      - name: Pin R7 TLS fingerprint Qt regression on macOS
        shell: bash
        run: |
          set -euo pipefail
          selector='^gui[.]offscreen-tls-fingerprint-rotation-and-denials$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': gui.offscreen-tls-fingerprint-rotation-and-denials' <<< "$selected_tests"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")" -eq 1
          ctest --test-dir build -C Release --timeout 30 \
            -R "$selector" --output-on-failure

      # Independently count the R7 Qt client-stage regression on packaged arm64.
      - name: Pin R7 client-stage Qt CTest at exact packaging HEAD
        shell: bash
        run: |
          set -euo pipefail
          client_stage_selection='^gui[.]offscreen-client-stage-and-retirement-status-denials$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$client_stage_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': gui.offscreen-client-stage-and-retirement-status-denials' <<< "$selected_tests"
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne 1 ]]; then
            printf 'R9 R7 client-stage CTest registry mismatch: expected 1, found %s\n' \
              "$selected_test_count" >&2
            exit 1
          fi
          ctest --test-dir build -C Release --timeout 30 \
            -R "$client_stage_selection" --output-on-failure

      # R7 tray lifecycle is an exact-one offline Qt requirement: window close
      # hides active sharing, while explicit Quit enters Stop/Revoke first.
      - name: Pin R7 tray close-hide and explicit-Quit Qt CTest
        shell: bash
        run: |
          set -euo pipefail
          selector='^gui[.]offscreen-tray-close-hide-and-explicit-quit$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': gui.offscreen-tray-close-hide-and-explicit-quit' <<< "$selected_tests"
          selected_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_count" -ne 1 ]]; then
            printf 'R9 GUI tray lifecycle registry mismatch: expected 1, found %s\n' \
              "$selected_count" >&2
            exit 1
          fi
          ctest --test-dir build -C Release --timeout 30 \
            -R "$selector" --output-on-failure

      # R7 typed lifecycle/terminal-session projection must remain exact-one.
      - name: Pin R7 lifecycle and terminal-close Qt CTest
        shell: bash
        run: |
          set -euo pipefail
          selector='^gui[.]offscreen-lifecycle-and-terminal-close-denials$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': gui.offscreen-lifecycle-and-terminal-close-denials' <<< "$selected_tests"
          selected_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_count" -ne 1 ]]; then
            printf 'R9 R7 lifecycle registry mismatch: expected 1, found %s\n' "$selected_count" >&2
            exit 1
          fi
          ctest --test-dir build -C Release --timeout 30 \
            -R "$selector" --output-on-failure

      # R7 unsupported independent-password mode must expose no secret inputs.
      - name: Pin R7 non-collecting unsupported-password Qt CTest
        shell: bash
        run: |
          set -euo pipefail
          selector='^gui[.]offscreen-independent-password-workflow-unavailable$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$selected_tests"
          grep -Fq ': gui.offscreen-independent-password-workflow-unavailable' <<< "$selected_tests"
          selected_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_count" -ne 1 ]]; then
            printf 'R9 unsupported-password registry mismatch: expected 1, found %s\n' "$selected_count" >&2
            exit 1
          fi
          ctest --test-dir build -C Release --timeout 30 \
            -R "$selector" --output-on-failure

      # Pair R10's production stable-interface/address predicate with R7's
      # Qt chooser on the same AppleClang/Qt Release packaging runner.
      # Fixtures are offline and cannot authorize R1/R2 or open sockets.
      - name: Run R10 R7 shared LAN endpoint selection denials
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release \
            --target test_runtime_host_control test_desktop_gui_offline --parallel 2
          lan_endpoint_selection='^(runtime[.]host-control-selected-lan-interface-denials|gui[.]offscreen-selected-lan-endpoint-preflight-denials)$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$lan_endpoint_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'runtime.host-control-selected-lan-interface-denials' <<< "$selected_tests"
          grep -Fq 'gui.offscreen-selected-lan-endpoint-preflight-denials' <<< "$selected_tests"
          readonly lan_endpoint_expected_test_count=2
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$lan_endpoint_expected_test_count" ]]; then
            printf 'R9 R10/R7 LAN registry mismatch: expected %s tests, found %s\n' \
              "$lan_endpoint_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          ctest --test-dir build -C Release --timeout 30 \
            -R "$lan_endpoint_selection" --output-on-failure

      # Run the production GUI constructor-order security guard on the
      # same hosted AppleClang/Qt build that packages and opens the actual
      # extracted .app. Offscreen widget end-state checks cannot expose
      # transient QLabel AutoText parsing during construction.
      - name: Run R7 runtime PlainText constructor-order source guard
        shell: bash
        run: |
          set -euo pipefail
          gui_plain_text_source_selection='^gui[.]runtime-label-plain-before-text-assignment$'
          selected_tests="$(ctest --test-dir build -C Release -N -R "$gui_plain_text_source_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'gui.runtime-label-plain-before-text-assignment' <<< "$selected_tests"
          readonly gui_plain_text_source_expected_test_count=1
          selected_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tests")"
          if [[ "$selected_test_count" -ne "$gui_plain_text_source_expected_test_count" ]]; then
            printf 'R9 R7 Qt PlainText source registry mismatch: expected %s test, found %s\n' \
              "$gui_plain_text_source_expected_test_count" "$selected_test_count" >&2
            exit 1
          fi
          ctest --test-dir build -C Release --timeout 30 \
            -R "$gui_plain_text_source_selection" --output-on-failure

      - name: Package and verify real macOS Qt app closure
        shell: bash
        run: |
          set -euo pipefail
          qt_prefix="$(brew --prefix qt)"
          version="$(sed -n 's/.*project(RDP_server VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          archive="build/rdp-server-portable-gui-$version-macos-arm64-$short_sha.zip"
          python3 packaging/macos/gui_bundle.py \
            --app build/rdp-server-desktop.app \
            --macdeployqt "$qt_prefix/bin/macdeployqt" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --minimum-macos 13.0 \
            --output "$archive"
          outer_sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test -n "$outer_sha"
          grep -Fqx "$outer_sha  $(basename "$archive")" "$archive.sha256"
          python3 scripts/verify_portable_gui.py \
            --archive "$archive" \
            --git-sha "$GITHUB_SHA" \
            --outer-sha256 "$outer_sha"

          extracted="build/Extracted macOS PORTABLE GUI"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          ditto -x -k "$archive" "$extracted"
          app="$extracted/rdp-server-desktop.app"
          test -x "$app/Contents/MacOS/rdp-server-desktop"
          test -f "$app/Contents/PlugIns/platforms/libqcocoa.dylib"
          for framework in QtCore QtGui QtWidgets; do
            test -d "$app/Contents/Frameworks/$framework.framework"
          done

          report="build/macos-gui-otool.txt"
          : > "$report"
          while IFS= read -r binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              printf '\n== %s ==\n' "$binary" >> "$report"
              otool -L "$binary" >> "$report"
            fi
          done < <(find "$app/Contents" -type f -print)
          test -s "$report"
          if grep -E '/opt/homebrew|/usr/local|/Users/runner|/Users/runneradmin' "$report"; then
            echo "Extracted macOS GUI retains nonportable build-host dependency" >&2
            exit 1
          fi

          # Verify the *extracted* archive, not only the pre-ZIP staging tree.
          # Ad-hoc signing is development-only; it grants no Gatekeeper trust.
          codesign --verify --deep --strict "$app"
          signature_report="$(codesign -dv "$app" 2>&1)"
          printf '%s\n' "$signature_report"
          grep -F 'Signature=adhoc' <<< "$signature_report"
          if grep -Eq '^Authority=Developer ID|^TeamIdentifier=[A-Z0-9]+' <<< "$signature_report"; then
            echo "Preview unexpectedly reports a production signing identity" >&2
            exit 1
          fi
      - name: Launch extracted Cocoa app normally without opening TCP listeners
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/smoke_macos_gui_open.py \
            --app "build/Extracted macOS PORTABLE GUI/rdp-server-desktop.app"

      - name: R6 verify explicit owner-acceptance UI parity on macOS
        shell: bash
        run: |
          set -euo pipefail
          qt_prefix="$(brew --prefix qt)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=ON \
            -DRDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI=ON \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            "-DCMAKE_PREFIX_PATH=$qt_prefix"
          grep -Fx 'RDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI:BOOL=ON' build/CMakeCache.txt
          cmake --build build --config Release --parallel 2 --target \
            rdp-server-desktop test_desktop_gui_offline
          acceptance_selector='^gui[.]offscreen-owner-acceptance-(editor-properties|consumer-start-orchestration|password-change-rerequests-owner-permission|start-failure-rolls-back|listener-start-failure-keeps-clipboard-dormant)$'
          acceptance_tests="$(ctest --test-dir build -C Release -N -R "$acceptance_selector")"
          printf '%s\n' "$acceptance_tests"
          for required_test in \
            gui.offscreen-owner-acceptance-editor-properties \
            gui.offscreen-owner-acceptance-consumer-start-orchestration \
            gui.offscreen-owner-acceptance-password-change-rerequests-owner-permission \
            gui.offscreen-owner-acceptance-start-failure-rolls-back \
            gui.offscreen-owner-acceptance-listener-start-failure-keeps-clipboard-dormant; do
            grep -Fq ": $required_test" <<< "$acceptance_tests"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$acceptance_tests")" -eq 5
          QT_QPA_PLATFORM=offscreen ctest --test-dir build -C Release --timeout 45 \
            -R "$acceptance_selector" --output-on-failure

      # CI ad-hoc preview signing is not Developer ID signing or notarization.
      # Publish only after extracted Cocoa launch, signature and Mach-O audits pass.
      - name: Upload verified macOS arm64 PORTABLE-GUI archive
        uses: actions/upload-artifact@v4
        with:
          name: rdp-server-portable-gui-macos-arm64
          path: |
            build/rdp-server-portable-gui-*-macos-arm64-*.zip
            build/rdp-server-portable-gui-*-macos-arm64-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  r7-macos-session-sanitizers:
    needs: ci-workflow-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GCC sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v gcc
          command -v g++
          gcc --version
          g++ --version
      - name: Configure R7 session-watch tests with ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=OFF \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Compile R7 session-watch test targets
        run: |
          cmake --build build --config Debug --parallel 2 --target \
            test_macos_desktop_session_guard test_macos_input_controller \
            test_macos_capture_pixel_buffer
      - name: Run R7 macOS session-watch CTests with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          desktop_session_selection='^macos\.desktop-session-'
          desktop_session_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$desktop_session_selection")"
          printf '%s\n' "$desktop_session_tests"
          for required_test in \
            macos.desktop-session-lifecycle \
            macos.desktop-session-validation-denials \
            macos.desktop-session-revocation-reentry \
            macos.desktop-session-switch-away-back-revocation \
            macos.desktop-session-mid-operation-epoch-change \
            macos.desktop-session-watch-registration-retirement \
            macos.desktop-session-watch-retirement-callback-race \
            macos.desktop-session-watch-partial-install-retirement \
            macos.desktop-session-watch-destructor-retirement \
            macos.desktop-session-watch-unavailable-denial; do
            grep -Fq "$required_test" <<< "$desktop_session_tests"
          done
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$desktop_session_selection" --output-on-failure

          input_session_selection='^macos\.input-controller-(session-watch-revocation|authority-retirement-no-native-post)$'
          input_session_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$input_session_selection")"
          printf '%s\n' "$input_session_tests"
          readonly input_session_expected_test_count=2
          input_session_test_count="$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$input_session_tests")"
          if [[ "$input_session_test_count" -ne "$input_session_expected_test_count" ]]; then
            printf 'R7 input sanitizer registry mismatch: expected %s tests, found %s\n' \
              "$input_session_expected_test_count" "$input_session_test_count" >&2
            exit 1
          fi
          grep -Fq 'macos.input-controller-session-watch-revocation' <<< "$input_session_tests"
          grep -Fq 'macos.input-controller-authority-retirement-no-native-post' <<< "$input_session_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$input_session_selection" --output-on-failure

          cursor_publication_selection='^macos\.cursor-(session-watch-revocation|topology-publication-revocation|geometry-generation-publication-denials)$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$cursor_publication_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'macos.cursor-session-watch-revocation' <<< "$selected_tests"
          grep -Fq 'macos.cursor-topology-publication-revocation' <<< "$selected_tests"
          grep -Fq 'macos.cursor-geometry-generation-publication-denials' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$cursor_publication_selection" --output-on-failure

  documentation-policy:
    needs: ci-workflow-structure
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation for every implementation commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/check_documentation_cochange.py "$BEFORE_SHA" "$AFTER_SHA"

  publish-protocol-prerelease:
    # Deploy ONLY tested protocol-library artifacts, never a server.
    # An authorized protocol-vX.Y.Z tag triggers publication automatically.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/protocol-v')
    needs: [ci-workflow-structure, protocol, documentation-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main ancestry and exact project version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          version=$(sed -nE 's/^project\(RDP_server VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "protocol-v$version"
      - name: Download all verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: protocol-package-*
          merge-multiple: true
          path: build/release-artifacts
      - name: Verify three archives and digests were received
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build/release-artifacts -maxdepth 1 -name 'rdp-server-protocol-*.zip' | wc -l)" -eq 3
          test "$(find build/release-artifacts -maxdepth 1 -name 'SHA256SUMS-*.txt' | wc -l)" -eq 3
          cd build/release-artifacts
          for checksums in SHA256SUMS-*.txt; do
            # Digests were generated from the CI build/ directory.
            sed 's@  @  @' "$checksums" | sha256sum --check --status
          done
      - name: Publish development-only GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            build/release-artifacts/rdp-server-protocol-*.zip \
            build/release-artifacts/SHA256SUMS-*.txt \
            --prerelease \
            --title "RDP C++23 protocol SDK $GITHUB_REF_NAME" \
            --notes "Development-only protocol static-library packages. NOT a deployable or authenticated RDP desktop server; no daemon or service is included."

  # R5/R7/R9: distinct offline GUI ZIP; never starts the RDP server.
  # Xvfb proves Qt/XCB startup only, never authenticates a physical seat0.
  r5-linux-gui-zip:
    needs: ci-workflow-structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 XCB and offline ZIP validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-qpa-plugins libssl-dev libsystemd-dev pkg-config \
            libkrb5-dev libpam0g-dev \
            xvfb xauth unzip python3
      - name: R5 offline GUI packaging negative tests
        run: |
          set -euo pipefail
          python3 tests/test_linux_gui_preflight.py
          python3 tests/test_linux_gui_bundle.py
      - name: Build R7 GUI and run native read-only R5 preflight CTest
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DRDP_SERVER_BUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=ON \
            -DRDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI=OFF
          grep -Fx 'RDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI:BOOL=OFF' build/CMakeCache.txt
          cmake --build build --config Release \
            --target rdp-server-desktop test_linux_gui_prerequisites \
              test_desktop_gui_offline test_runtime_host_control --parallel 2
          r5_prerequisite_selector='^(gui[.]linux-readonly-(seat0-prerequisite-denials|prerequisite-structured-projection)|gui[.]linux-prerequisite-probe-readonly-boundary)$'
          selected_r5_prerequisite_tests="$(ctest --test-dir build -C Release -N -R "$r5_prerequisite_selector")"
          printf '%s\n' "$selected_r5_prerequisite_tests"
          for required_test in \
            gui.linux-readonly-seat0-prerequisite-denials \
            gui.linux-readonly-prerequisite-structured-projection \
            gui.linux-prerequisite-probe-readonly-boundary; do
            grep -Fq ": $required_test" <<< "$selected_r5_prerequisite_tests"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_r5_prerequisite_tests")" -eq 3
          ctest --test-dir build -C Release --timeout 20 \
            -R "$r5_prerequisite_selector" --output-on-failure
          tls_selector='^gui[.]offscreen-tls-fingerprint-rotation-and-denials$'
          selected_tls_tests="$(ctest --test-dir build -C Release -N -R "$tls_selector")"
          printf '%s\n' "$selected_tls_tests"
          grep -Fq ': gui.offscreen-tls-fingerprint-rotation-and-denials' <<< "$selected_tls_tests"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$selected_tls_tests")" -eq 1
          ctest --test-dir build -C Release --timeout 30 \
            -R "$tls_selector" --output-on-failure

          round2_selector='^(gui[.]offscreen-round2-tabs-and-main-simplicity|gui[.]offscreen-round2-endpoint-refresh-fail-closed|gui[.]offscreen-round2-advanced-groups-scrollable|gui[.]offscreen-sharing-permission-product-language|gui[.]round2-tab-source-contract|gui[.]round2-qcolor-warning-classification|runtime[.]host-control-gui-round2-endpoint-recommendation)$'
          round2_tests="$(ctest --test-dir build -C Release -N -R "$round2_selector")"
          printf '%s\n' "$round2_tests"
          for required_test in \
            gui.offscreen-round2-tabs-and-main-simplicity \
            gui.offscreen-round2-endpoint-refresh-fail-closed \
            gui.offscreen-round2-advanced-groups-scrollable \
            gui.offscreen-sharing-permission-product-language \
            gui.round2-tab-source-contract \
            gui.round2-qcolor-warning-classification \
            runtime.host-control-gui-round2-endpoint-recommendation; do
            grep -Fq ": $required_test" <<< "$round2_tests"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$round2_tests")" -eq 7
          ctest --test-dir build -C Release --timeout 30 \
            -R "$round2_selector" --output-on-failure
      - name: Package, extract and inspect actual Qt/XCB closure
        shell: bash
        run: |
          set -euo pipefail
          command -v qmake6
          qt_plugin_root="$(qmake6 -query QT_INSTALL_PLUGINS)"
          test -n "$qt_plugin_root"
          qt_plugin="$qt_plugin_root/platforms/libqxcb.so"
          test -f "$qt_plugin"
          printf 'Qt XCB plugin: %s\n' "$qt_plugin"
          version="$(sed -n 's/.*project(RDP_server VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          archive="build/rdp-server-gui-$version-linux-$RUNNER_ARCH-$short_sha.zip"
          python3 packaging/linux/gui_bundle.py bundle \
            --gui build/rdp-server-desktop \
            --xcb-plugin "$qt_plugin" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --output "$archive"
          python3 packaging/linux/gui_bundle.py verify --bundle "$archive"
          sha256sum "$archive" > build/rdp-server-gui-SHA256SUMS.txt
          unzip -q "$archive" -d build/gui-extracted
          test -x build/gui-extracted/bin/rdp-server-desktop
          test -x build/gui-extracted/run-gui.sh
          test -x "build/gui-extracted/RDP Server.desktop"
          export LD_LIBRARY_PATH="$PWD/build/gui-extracted/lib"
          ldd build/gui-extracted/bin/rdp-server-desktop \
            | tee build/gui-extracted/elf-dependencies.txt
          ldd build/gui-extracted/plugins/platforms/libqxcb.so \
            | tee build/gui-extracted/plugin-dependencies.txt
          if grep -Fq 'not found' build/gui-extracted/*dependencies.txt; then
            echo "GUI ZIP contains unresolved native dependencies" >&2
            exit 1
          fi
          (
            cd build/gui-extracted
            set +e
            timeout 5s xvfb-run -a ./run-gui.sh >../gui-smoke.log 2>&1
            result=$?
            set -e
            if [ "$result" -ne 124 ]; then
              cat ../gui-smoke.log
              echo "Extracted Qt GUI failed startup/idle smoke" >&2
              exit 1
            fi
          )
      - name: Run R5 physical-X11 precredential owner-readiness gate
        shell: bash
        run: |
          set -euo pipefail
          # The public Release+OFF ZIP was already sealed in the previous step.
          # Reuse this job's one build root for the explicit owner-acceptance
          # surface; do not rebuild or repack the public archive after this.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DRDP_SERVER_BUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=ON \
            -DRDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI=ON
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI:BOOL=ON' build/CMakeCache.txt
          cmake --build build --config Release \
            --target test_linux_gui_physical_x11_precredential_readiness --parallel 2
          readiness_selector='^runtime[.]linux-gui-physical-x11-precredential-readiness$'
          readiness_tests="$(ctest --test-dir build -C Release -N -R "$readiness_selector")"
          printf '%s\n' "$readiness_tests"
          grep -Fq ': runtime.linux-gui-physical-x11-precredential-readiness' \
            <<< "$readiness_tests"
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$readiness_tests")" -eq 1

          set +e
          readiness_output="$(QT_QPA_PLATFORM=offscreen ctest \
            --test-dir build -C Release --timeout 30 -V \
            -R "$readiness_selector" 2>&1)"
          readiness_result=$?
          set -e
          printf '%s\n' "$readiness_output"
          test "$readiness_result" -eq 0
          grep -Eq 'runtime[.]linux-gui-physical-x11-precredential-readiness .*Passed' \
            <<< "$readiness_output"
          if grep -Eq 'runtime[.]linux-gui-physical-x11-precredential-readiness .*Skipped' \
              <<< "$readiness_output"; then
            echo "R5 owner-situation readiness gate skipped instead of exercising a LAN recommendation" >&2
            exit 1
          fi
      - name: Upload Linux GUI preview ZIP and digest
        uses: actions/upload-artifact@v4
        with:
          name: rdp-server-gui-linux
          path: |
            build/rdp-server-gui-*.zip
            build/rdp-server-gui-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # R9 P0: stronger than GUI Round 2 presentation qualification. This gate
  # exercises canonical no-argument Linux bootstrap and the exact production
  # StandalonePassword/owner/listener path. It is independent of CLEAN Windows.
  r9-portable-gui-bootstrap-acceptance:
    needs: ci-workflow-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install portable GUI bootstrap dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-qpa-plugins libssl-dev libsystemd-dev pkg-config \
            libkrb5-dev libpam0g-dev xvfb xauth iproute2 unzip python3
      - name: Configure Release owner-acceptance production bootstrap graph
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DRDP_SERVER_BUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=ON \
            -DRDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI=ON
          grep -Fx 'RDP_SERVER_BUILD_DESKTOP_GUI:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'RDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI:BOOL=ON' build/CMakeCache.txt
          cmake --build build --config Release --target rdp-server-linux-runtime-security --parallel 2
      - name: Build and run exact portable bootstrap acceptance inventory
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 2
          bootstrap_selector='^(runtime[.]bootstrap-portable-storage-and-no-autostart-contract|runtime[.]desktop-shared-configuration-feed|runtime[.]linux-no-config-standalone-current-x11-selection|runtime[.]linux-portable-gui-bootstrap-listener-acceptance|runtime[.]linux-gui-bootstrap-clipboard-dormancy|gui[.]offscreen-owner-acceptance-editor-properties|gui[.]offscreen-owner-acceptance-consumer-start-orchestration|gui[.]offscreen-owner-acceptance-password-change-rerequests-owner-permission|gui[.]offscreen-owner-acceptance-start-failure-rolls-back|gui[.]offscreen-owner-acceptance-listener-start-failure-keeps-clipboard-dormant)$'
          bootstrap_tests="$(ctest --test-dir build -C Release -N -R "$bootstrap_selector")"
          printf '%s\n' "$bootstrap_tests"
          for required_test in \
            runtime.bootstrap-portable-storage-and-no-autostart-contract \
            runtime.desktop-shared-configuration-feed \
            runtime.linux-no-config-standalone-current-x11-selection \
            runtime.linux-portable-gui-bootstrap-listener-acceptance \
            runtime.linux-gui-bootstrap-clipboard-dormancy \
            gui.offscreen-owner-acceptance-editor-properties \
            gui.offscreen-owner-acceptance-consumer-start-orchestration \
            gui.offscreen-owner-acceptance-password-change-rerequests-owner-permission \
            gui.offscreen-owner-acceptance-start-failure-rolls-back \
            gui.offscreen-owner-acceptance-listener-start-failure-keeps-clipboard-dormant; do
            grep -Fq ": $required_test" <<< "$bootstrap_tests"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$bootstrap_tests")" -eq 10
          QT_QPA_PLATFORM=offscreen ctest --test-dir build -C Release --timeout 45 \
            -R "$bootstrap_selector" --output-on-failure
      - name: Canonical no-argument launch remains pre-listener and secret-free
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen ./build/rdp-server-desktop \
            >build/r9-portable-gui-bootstrap.log 2>&1 &
          desktop_pid=$!
          cleanup() {
            kill "$desktop_pid" 2>/dev/null || true
            wait "$desktop_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 2
          kill -0 "$desktop_pid"
          if ss -ltnp 2>/dev/null | grep -Fq "pid=$desktop_pid,"; then
            echo "no-argument GUI opened a listener before explicit Sharing" >&2
            exit 1
          fi
          if grep -Eiq '(password|secret|ntlm|keytab|private[-_ ]?key)[[:space:]]*[:=]' \
              build/r9-portable-gui-bootstrap.log; then
            echo "bootstrap log exposed secret-bearing material" >&2
            exit 1
          fi
      - name: Package exact owner-acceptance ZIP and verify canonical launch
        shell: bash
        run: |
          set -euo pipefail
          command -v qmake6
          qt_plugin_root="$(qmake6 -query QT_INSTALL_PLUGINS)"
          test -n "$qt_plugin_root"
          qt_plugin="$qt_plugin_root/platforms/libqxcb.so"
          test -f "$qt_plugin"
          version="$(sed -n 's/.*project(RDP_server VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          archive="build/rdp-server-owner-acceptance-$version-linux-$RUNNER_ARCH-$short_sha.zip"
          python3 packaging/linux/gui_bundle.py bundle \
            --gui build/rdp-server-desktop \
            --xcb-plugin "$qt_plugin" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --output "$archive"
          python3 packaging/linux/gui_bundle.py verify --bundle "$archive"
          sha256sum "$archive" > build/rdp-server-owner-acceptance-SHA256SUMS.txt
          unzip -q "$archive" -d build/r9-owner-acceptance-extracted
          test -x build/r9-owner-acceptance-extracted/run-gui.sh
          (
            cd build/r9-owner-acceptance-extracted
            set +e
            timeout 5s xvfb-run -a ./run-gui.sh >../r9-owner-acceptance-package-smoke.log 2>&1
            result=$?
            set -e
            if [ "$result" -ne 124 ]; then
              cat ../r9-owner-acceptance-package-smoke.log
              echo "owner-acceptance ZIP failed canonical no-argument startup smoke" >&2
              exit 1
            fi
          )
      - name: Upload exact owner-acceptance Linux ZIP and digest
        uses: actions/upload-artifact@v4
        with:
          name: rdp-server-owner-acceptance-linux
          path: |
            build/rdp-server-owner-acceptance-*.zip
            build/rdp-server-owner-acceptance-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # R9 P0 owner-reported GUI credential usability parity. This is a focused
  # Linux+macOS qualification gate and has no CLEAN Windows dependency.
  r9-owner-gui-credential-parity:
    needs: ci-workflow-structure
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux owner-GUI parity dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-qpa-plugins libssl-dev libsystemd-dev pkg-config \
            libkrb5-dev libpam0g-dev xvfb xauth iproute2 unzip python3
      - name: Install macOS owner-GUI parity dependencies
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install openssl@3 qt
      - name: Configure explicit Release owner-acceptance surface
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extra+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
            extra+=("-DCMAKE_PREFIX_PATH=$(brew --prefix qt)")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DRDP_SERVER_BUILD_TESTING=ON \
            -DRDP_SERVER_BUILD_DESKTOP_GUI=ON \
            -DRDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI=ON \
            "${extra[@]}"
          grep -Fx 'RDP_SERVER_ENABLE_OWNER_ACCEPTANCE_UI:BOOL=ON' build/CMakeCache.txt
          cmake --build build --config Release \
            --target test_desktop_gui_offline --parallel 2
      - name: Run production-path and behavioral credential parity gates
        shell: bash
        run: |
          set -euo pipefail
          selector='^(gui[.]owner-acceptance-release-gate-and-production-path|gui[.]offscreen-owner-acceptance-credential-editor-parity|gui[.]offscreen-owner-acceptance-password-stop-restart-reuses-memory-credential|gui[.]offscreen-authentication-incomplete-before-native-admission|gui[.]offscreen-owner-authentication-failure-product-language-and-retention|gui[.]offscreen-local-username-default-keeps-session-password-empty)$'
          inventory="$(ctest --test-dir build -C Release -N -R "$selector")"
          printf '%s\n' "$inventory"
          for required in \
            gui.owner-acceptance-release-gate-and-production-path \
            gui.offscreen-owner-acceptance-credential-editor-parity \
            gui.offscreen-owner-acceptance-password-stop-restart-reuses-memory-credential \
            gui.offscreen-authentication-incomplete-before-native-admission \
            gui.offscreen-owner-authentication-failure-product-language-and-retention \
            gui.offscreen-local-username-default-keeps-session-password-empty; do
            grep -Fq ": $required" <<< "$inventory"
          done
          test "$(awk '/^[[:space:]]*Test[[:space:]]+#[0-9]+:/ { ++count } END { print count + 0 }' <<< "$inventory")" -eq 6
          QT_QPA_PLATFORM=offscreen ctest --test-dir build -C Release \
            --timeout 30 -R "$selector" --output-on-failure
          # A registered skip must not qualify the owner-acceptance surface.
          test -x build/tests/test_desktop_gui_offline
          QT_QPA_PLATFORM=offscreen \
            build/tests/test_desktop_gui_offline owner-gui-credential-parity
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a env QT_QPA_PLATFORM=xcb \
              build/tests/test_desktop_gui_offline owner-gui-credential-parity
          fi
