          grep -Fq 'x11.capture-bgra-ingress' <<< "$selected_tests"
          grep -Fq 'x11.capture-stride-layout-denials' <<< "$selected_tests"
          grep -Fq 'x11.capture-generation-retirement' <<< "$selected_tests"
          grep -Fq 'x11.native-geometry-observation-generation-retirement' <<< "$selected_tests"
          grep -Fq 'x11.same-pixel-randr-capture-retirement' <<< "$selected_tests"
          grep -Fq 'x11.randr-burst-generation-retirement-recovery' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-capture-pixel-parity' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-randr-capture-generation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-randr-stale-damage-isolation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-authority-retirement-queued-damage-isolation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-reentrant-authority-loss-damage-dispatch' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-pointer-randr-stale-motion-isolation' <<< "$selected_tests"
          grep -Fq 'x11.desktop-resource-capture-terminal-denial' <<< "$selected_tests"
          grep -Fq 'x11.capture-native-destructor-retirement' <<< "$selected_tests"
          grep -Fq 'x11.input-native-generation-mismatch-denial' <<< "$selected_tests"
          grep -Fq 'x11.input-native-authority-retirement-no-native-post' <<< "$selected_tests"
          grep -Fq 'x11.input-authorized-slow-path-native-mapping-denials' <<< "$selected_tests"

          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$r5_x11_selection" --output-on-failure


      - name: Run bounded coverage-guided MCS/CLIPRDR fuzzer
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          fuzz_selection='^fuzz\.mcs-cliprdr-bounded$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$fuzz_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'fuzz.mcs-cliprdr-bounded' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$fuzz_selection" --output-on-failure

      - name: Run bounded coverage-guided CredSSP fuzzer
        if: ${{ always() && steps.compile_protocol_tests.outcome == 'success' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          fuzz_selection='^fuzz\.credssp-bounded$'
          selected_tests="$(ctest --test-dir build --build-config Debug -N \
            -R "$fuzz_selection")"
          printf '%s\n' "$selected_tests"
          grep -Fq 'fuzz.credssp-bounded' <<< "$selected_tests"
          ctest --test-dir build --build-config Debug --timeout 60 \
            -R "$fuzz_selection" --output-on-failure

